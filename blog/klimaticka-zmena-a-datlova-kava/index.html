\", \"text\": \"Roste v úzkém tropickém pásu, potřebuje přesnou teplotu i dost vody a na kilogram patří mezi nejnáročnější potraviny vůbec. Na jeden kilogram pražené kávy připadá kolem 28 kg oxidu uhličitého, víc než na sýr nebo vepřové.\"}},\n    {\"@type\": \"Question\", \"name\": \"Co je datlová káva a proč se o ní mluví?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Je to pražený nápoj z datlových pecek, tedy suroviny, která běžně končí jako krmivo nebo se přehlédne. U nás ji vyrábí tamoje pod jménem Datlová Pecka a dáš si ji jako espresso i filtr. Přirozeně nikdy neobsahovala kofein.\"}}\n  ]\n}\n<\u002Fscript>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\"@type\": \"ListItem\", \"position\": 1, \"name\": \"tamoje\", \"item\": \"https://tamoje.cz\"},\n    {\"@type\": \"ListItem\", \"position\": 2, \"name\": \"Čtení k jádru věci\", \"item\": \"https://tamoje.cz/blog\"},\n    {\"@type\": \"ListItem\", \"position\": 3, \"name\": \"Pěstitelnost kávy a klima\"}\n  ]\n}\n<\u002Fscript>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b2ec9e6f-95a5-4ca7-a029-2bd2072a5a71\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d3f12561-c6a6-4c9b-a08b-39ee873ea0cb\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6a7347cd-ae44-4edf-a101-00 kground-color .2s var(--ease)}\n.mnavcta:hover{background:var(--rasp-hi)}\n@media(max-width:620px){\n  .mnav-links{gap:16px}\n  .mnav-links a{font-size:.68rem;letter-spacing:.08em}\n  .mnavcta{display:none}\n}\n\n/* ---- Sections ---- */\n.msec{padding:60px var(--pad)}\n.msec--dark{background:var(--plum);color:var(--white)}\n.msec--cream{background:var(--cream)}\n.msec--cream2{background:var(--cream-2)}\n.msec--photo{position:relative;background-size:cover;background-position:center;color:var(--white)}\n.msec--photo::before{content:\"\";position:absolute;inset:0;\n  background:linear-gradient(180deg,rgba(40,0,36,.34) 0%,rgba(40,0,36,.42) 45%,rgba(40,0,36,.68) 100%)}\n.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto}\n.wrap--read{max-width:720px}\n.on-photo{text-shadow:0 1px 18px rgba(40,0,23,.55),0 1px 3px rgba(40,0,23,.5)}\n.ink{color:var(--ink)}\n\n/* ---- Type ---- */\n.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;display:block;margin-bottom:14px}\n.h1{font-size:clamp(2.4rem,5.5vw,3.6rem);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin:0}\n.h2{font-size:clamp(1.7rem,3.2vw,2.3rem);font-weight:700;line-height:1.12;letter-spacing:-.015em;margin:0}\n.h3{font-size:1.2rem;font-weight:700;line-height:1.2;margin:0}\n.lead{font-size:clamp(1.05rem,1.6vw,1.2rem);font-weight:400;line-height:1.5}\n.body{font-size:1.02rem;line-height:1.7}\n.body+.body{margin-top:1rem}\n.meta{font-size:.8125rem;font-weight:700;letter-spacing:.04em}\n.kicker{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}\n.accent{color:var(--rasp)}\n.stack>*+*{margin-top:18px}\n.stack-lg>*+*{margin-top:26px}\n\n/* ---- Buttons ---- */\n.mbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;\n  font-size:.92rem;font-weight:700;letter-spacing:.04em;border:1.5px solid transparent;\n  transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}\n.mbtn:active{transform:translateY(1px)}\n.mbtn--rasp{background:var(--rasp);color:#fff;border-color:var(--rasp)}\n.mbtn--ink{background:var(--ink);color:#fff;border-color:var(--ink)}\n.mbtn--outl{background:transparent;color:#fff;border-color:#fff}\n.mbtn--outd{background:transparent;color:var(--ink);border-color:var(--ink)}\n@media(hover:hover){\n  .mbtn--rasp:hover{background:var(--rasp-hi);border-color:var(--rasp-hi)}\n  .mbtn--ink:hover{background:#5a1233;border-color:#5a1233}\n  .mbtn--outl:hover{color:var(--rasp-hi);border-color:var(--rasp-hi)}\n  .mbtn--outd:hover{color:var(--rasp);border-color:var(--rasp)}\n}\n\n/* ---- Footer ---- */\n.mfoot{background:var(--plum);color:var(--white);padding:44px var(--pad)}\n.mfoot__inner{max-width:1040px;margin:0 auto}\n.mfoot .brand{display:block;margin-bottom:18px;font-size:1.4rem;font-weight:700;color:var(--white);text-transform:lowercase}\n.mfoot ul{list-style:none;display:flex;flex-wrap:wrap;gap:12px 26px;margin:0 0 22px;padding:0}\n.mfoot a{font-size:.9rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85);transition:color .2s var(--ease)}\n.mfoot a:hover{color:var(--rasp)}\n.mfoot .copy{font-size:.8rem;opacity:.6}\n<\u002Fstyle>\n<style>\n  /* Článek — staví na tamoje-blog.css (produkční systém) */\n  :root{--camel-300:#EEBB63;--camel-400:#E8A33D;--camel-500:#C9861F;--camel-600:#A66B12}\n  .a-hero{position:relative;background-image:url(\"94b1a0a3-de65-4db5-99fd-3bd49eb698bd\");background-color:#4a0d2e;background-position:center;background-size:cover;padding:0;min-height:clamp(220px,30vw,360px)}\n  .a-hero::before{display:none}\n\n  .body-sec{background:var(--plum)}\n  .article-body{max-width:916px;margin:0 auto;color:var(--ink);\n    background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.5);padding:52px 48px}\n  @media(max-width:640px){.article-body{padding:32px 22px}}\n  .article-body>p{font-size:1.08rem;line-height:1.75;margin 64,0,23,.14)}\n  .figcap{font-size:.82rem;line-height:1.65;color:#8a7079;margin:10px 0 0}\n  .figcap a{color:#8a7079;font-weight:700;border-bottom:1px solid rgba(138,112,121,.4)}\n  .snote{font-size:.82rem;line-height:1.65;color:#8a7079;margin:-18px 0 24px}\n\n  /* Produktový modul */\n  .pcard{background:var(--cream-2);border:1px solid rgba(64,0,23,.1);border-left:3px solid var(--rasp);padding:28px 30px;margin:32px 0}\n  .pcard__tag{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);margin:0 0 10px}\n  .pcard h3{font-size:1.35rem;font-weight:800;margin:0 0 12px;line-height:1.2}\n  .pcard h3 a{color:var(--plum);border-bottom:2px solid rgba(220,56,85,.35)}\n  .pcard h3 a:hover{border-bottom-color:var(--rasp)}\n  .pcard p{font-size:1rem;line-height:1.7;margin:0 0 12px;color:var(--ink)}\n  .pcard p:last-child{margin-bottom:0}\n  .pcard__fine{font-size:.8rem;color:#8a7079}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <template id=\"__bundler_thumbnail\" data-bg-color=\"#400024\">\n    <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n      <rect width=\"1200\" height=\"800\" fill=\"#400024\"><\u002Frect>\n      <circle cx=\"600\" cy=\"330\" r=\"150\" fill=\"none\" stroke=\"#DC3855\" stroke-width=\"26\"><\u002Fcircle>\n      <path d=\"M600 250 v80 l55 40\" fill=\"none\" stroke=\"#E5DFD7\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <text x=\"600\" y=\"560\" font-family=\"Mulish, sans-serif\" font-size=\"86\" font-weight=\"800\" fill=\"#E5DFD7\" text-anchor=\"middle\">tamoje<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Ftemplate>\n\n  <!-- ===== Header ===== -->\n  <header class=\"mhead\">\n    <div class=\"mhead__bar\">\n      <a class=\"brand\" href=\"/\">tamoje<\u002Fa>\n      <ul class=\"mnav-links\">\n        <li><a href=\"/tamoje-pribeh_pecky.html\">Příběh<\u002Fa><\u002Fli>\n        <li><a href=\"/blog\" aria-current=\"page\">Články<\u002Fa><\u002Fli>\n        <li><a href=\"/tamoje-kontakt.html\">Kontakt<\u002Fa><\u002Fli>\n      <\u002Ful>\n      <a class=\"mnavcta\" href=\"https://shop.tamoje.cz/eshop/\">E-shop<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===== Hero ===== -->\n  <section class=\"msec msec--photo a-hero\" data-screen-label=\"Článek — hero\"><\u002Fsection>\n\n  <!-- ===== Tělo článku ===== -->\n  <section class=\"msec body-sec\">\n    <article class=\"article-body\" data-screen-label=\"Článek — tělo\">\n\n      <nav class=\"crumb card-crumb\" aria-label=\"breadcrumb\">\n        <a href=\"/\">tamoje<\u002Fa> › <a href=\"/blog\">Čtení k jádru věci<\u002Fa> › Pěstitelnost kávy a klima\n      <\u002Fnav>\n\n      <h1 class=\"a-title\">Méně plýtvat, více objevovat<\u002Fh1>\n      <h2 class=\"a-subtitle\">Jak klimatická změna zdražuje pěstování kávy<br>a&nbsp;otevírá nové možnosti<\u002Fh2>\n\n      <div class=\"byline\">\n        <span class=\"byline__avatar\">LM<\u002Fspan>\n        <span class=\"byline__who\"><a class=\"byline__name byline__namelink\" href=\"#autor\">Lucie Mokrá →<\u002Fa><span class=\"byline__org\">zakladatelka tamoje<\u002Fspan><\u002Fspan>\n        <span class=\"byline__item\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg><time datetime=\"2026-07-28\">28. 7. 2026<\u002Ftime><\u002Fspan>\n        <span class=\"byline__item\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>9 min čtení<\u002Fspan>\n      <\u002Fdiv>\n      <hr class=\"a-divider\">\n\n      <p class=\"perex\"><strong>Kávě mizí půda pod nohama. Stěhuje se do vyšších poloh a&nbsp;její cena roste. Jaké jsou predikce, kterých plodin se klimatická změna týká nejvíce a&nbsp;proč svět začal znovu objevovat datlovou kávu?<\u002Fstrong><\u002Fp>\n\n      <div class=\"tldr\">\n        <h3 class=\"tldr__label\">Zde se dočteš, že:<\u002Fh3>\n        <ul>\n          <li>Jednou z nejnáročnějších plodin pro pěstování je káva. Jediný kilogram znamená produkci desítek kilo oxidu uhličitého a spotřebu tisíců litrů vody.<\u002Fli>\n          <li>Oblast pro pěstování kávy, takzvaný coffee belt, se mění. Přes polovinu dnes nejvhodnější půdy může do roku 2050 zmizet.<\u002Fli>\n          <li>Negativní vliv klimatických změn na pěstitelnost zaznamenáváme i u kakaa, avokáda a čaje. Není to tedy problém jediné plodiny, ale celého tropického pásu.<\u002Fli>\n          <li>Dekofeinizace je z pohledu zdrojů plýtvání surovinami. Vypěstuješ klimaticky nejnáročnější plodinu a pak z ní průmyslově odstraníš přesně to, kvůli čemu ji pěstuješ.<\u002Fli>\n          <li>Není to poprvé, kdy byl kávový rituál v ohrožení. Způsob, jakým si poradili naši předkové, je inspirující i dnes. Nyní ho objev s Datlovou Peckou.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <h2 class=\"h2\">Pěstování kávy ztrácí půdu pod&nbsp;nohama<\u002Fh2>\n\n      <p>Málokdo si u svého šálku uvědomí, že káva patří k nejnáročnějším plodinám, jaké vůbec pěstujeme. Roste jen v úzkém pásu kolem rovníku, takzvaném coffee belt, a potřebuje pro svůj růst specifické podmínky. Rozmezí teplot musí být nízké, mezi 18 a 21 °C. K tomu potřebuje dost vláhy, srážky kolem 1200 až 1800 milimetrů ročně, a mírně kyselou, dobře propustnou půdu. <strong>Nyní se vlivem klimatických změn oblast coffee belt zúžuje a nutí plodiny migrovat.<\u002Fstrong> Kam až mohou dojít?<\u002Fp>\n\n      <p>Regiony vhodné pro pěstování kávy, a jak se brzy dozvíš v článku i dalších surovin, pomalu ale jistě mizí. Sice ne ze dne na den, ale měřitelně a prokazatelně napříč studiemi.<\u002Fp>\n\n      <p>Studie z roku 2022 se zaměřila na tři dnes velmi populární plodiny, kávu, avokádo a kešu ořechy. Cílem studie bylo ověřit pěstitelnost v horizontu následujících zhruba třiceti let, tedy do roku 2050. Výsledek je na jednu stranu překvapivý. I přes očekávání, která se dala predikovat na základě vývoje klimatických změn, mají kešu i avokádo místy slibné vyhlídky do budoucna. <strong>Káva ale ne. A to ve všech hlavních regionech.<\u002Fstrong> Studie kávu dokonce označuje za nejzranitelnější z vybraných surovin a upozorňuje na předpoklad, že více než polovina dnes nejvhodnější půdy pro kávu, konkrétně <strong>54 %<\u002Fstrong>, může do roku 2050 zmizet.<\u002Fp>\n\n      <figure class=\"figure\">\n        <img src=\"b07f1387-f670-4dbd-b47c-5a002164a233\" width=\"1440\" height=\"719\" loading=\"lazy\" alt=\"Mapa současné vhodnosti pro pěstování kávy arabica ve světě. Zelené a modré oblasti ukazují regiony vhodné k pěstování, šedá nevhodné.\">\n        <figcaption class=\"figcap\">Kde se kávě daří dnes. Odstíny zelené a modré = vhodné oblasti, šedá = nevhodné. Zdroj: Grüter et al. 2022, PLOS ONE, <a href=\"https://doi.org/10.1371/journal.pone.0261976\" target=\"_blank\" rel=\"noopener\">DOI 10.1371/journal.pone.0261976<\u002Fa> (licence CC BY 4.0).<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <figure class=\"figure\">\n        <img src=\"33afab64-06ec-4758-be3b-dd0ec0bf92e4\" width=\"1440\" height=\"719\" loading=\"lazy\" alt=\"Mapa změny vhodnosti pro pěstování kávy arabica do roku 2050 podle scénáře RCP 4.5. Oranžové a červené oblasti ukazují pokles vhodnosti pěstování, zelené naopak zlepšení.\">\n        <figcaption class=\"figcap\">A jak se to změní do roku 2050 (scénář RCP 4.5). Oranžová a červená = pokles vhodnosti, zelená = zlepšení. Zdroj: Grüter et al. 2022, PLOS ONE, <a href=\"https://doi.org/10.1371/journal.pone.0261976\" target=\"_blank\" rel=\"noopener\">DOI 10.1371/journal.pone.0261976<\u002Fa> (licence CC BY 4.0).<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <p>Zatímco vhodné půdy ubývá, chuť na kávu ve světě roste. Dnes se ve světě vypije přes 177 milionů pytlů kávy, každý o hmotnosti 60 kilogramů. Dohromady jde tedy o více než 10 milionů tun ročně a spotřeba stoupá zhruba o dvě procenta ročně. Poptávka roste, pěstitelnost klesá a pomyslené „nůžky“ se rozevírají, což se projevuje i na ceně.<\u002Fp>\n\n      <h2 class=\"h2\">Migrace do&nbsp;vyšších poloh, aneb vzhůru do&nbsp;nekonečna?<\u002Fh2>\n\n      <p>Příroda si v určité míře umí poradit sama. Kávovníky se za lepšími podmínkami stěhují do vyšších poloh, kam bývalo dřív příliš chladno. Jenže vyšší nadmořská výška znamená i strmější svahy a horší podmínky pro růst. A hlavně, každá hora má svůj vrchol, který tento přesun jednou zastaví.<\u002Fp>\n\n      <p>Co je překvapivé? Některé regiony jižní Brazílie, části Číny nebo východní Afriky se díky stále mírnějším zimám stávají vhodnějšími oblastmi pro pěstování kávy a například Etiopie, domovina arabiky, patří k těm šťastnějším: vhodné pěstitelské plochy mohou narůst z 39 % půdy na 50 %.<\u002Fp>\n\n      <p>Nicméně globální směřování vede neúprosně k jasným bilancím, které potvrzuje hned několik nezávislých studií. Studie Bunn et al. z roku 2015 predikuje redukci vhodné plochy pro pěstování kávy zhruba o polovinu, studie Davis et al. z roku 2012 uvádí, že planá arabika, divoký předek dnešních odrůd, může ve volné přírodě dokonce úplně vymizet. Dle studie Davis et al. z roku 2019 se dokonce předpokládá vyhynutí šedesáti procentům všech druhů kávy. Kávu jmenuje mezi ohroženými plodinami i klimatický panel IPCC.<\u002Fp>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Proč je arabika tak zranitelná<\u002Fdiv>\n        <p>Existence arabiky stojí v podstatě na náhodě z minulosti. Vznikla dávným zkřížením dvou druhů a protože má jen málo genetické pestrosti, je velice náchylná a křehká. Pokud udeří nová choroba, třeba rez kávovníková, neumí se dostatečně bránit. Již dnes tato rez způsobuje ztráty v řádu miliard dolarů ročně.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 class=\"h2\">Stejné výzvě čelí kakao, avokádo i&nbsp;čaj<\u002Fh2>\n\n      <p>Pokud bychom zaznamenávali negativní změny v pěstitelnosti pouze u kávy, dalo by se to považovat za anomálii a slabou schopnost adaptace plodiny. Bohužel je pod stejným tlakem celá řada dalších surovin, které rostou v úzkém tropickém pásu.<\u002Fp>\n\n      <p>Jednou z ohrožených plodin je také kakao. Roste především v Ghaně a Pobřeží slonoviny a podle modelů se do roku 2050 stane méně vhodnými <strong>skoro 90 %<\u002Fstrong> dnešních pěstitelských lokalit.<\u002Fp>\n\n      <p>Ještě názornější je avokádo. Do roku 2050 přijdou hlavní producenti jako Peru, Dominikánská republika nebo Indonésie o <strong>54 až 85 %<\u002Fstrong> té nejlepší plochy, zatímco Mexiko bude potenciálně disponovat o 66 až 87 % více vhodné půdy. Je ovšem nutné zmínit, že jediný plod spotřebuje stovky litrů vody a mnohdy v krajích, ve kterých je vody tak zoufalý nedostatek, že je dokonce na příděl.<\u002Fp>\n\n      <p>Podobné vyhlídky jsou očekávány i u čaje. V Argentině, Malawi a Tanzanii má do roku 2050 zmizet 60 až 78 % té nejvhodnější plochy.<\u002Fp>\n\n      <p>A proč se to všechno děje? Za vším stojí hlavně teplota. Arabika chce úzké rozmezí kolem 18 až 21 °C. Jakmile se ustálí nad 23 °C, zrání se urychlí a zrno nestihne nabrat chuť. Kolem 30 °C už rostlina vážně strádá, žloutne a zakrňuje. K tomu se přidává nevyzpytatelné počasí, které rozhodí kvetení, a škůdci. Rez kávovníková i kávový zavíječ se s teplejšími zimami stěhují do stále vyšších poloh. Přesně tam, kam pěstitelé před klimatem utíkají.<\u002Fp>\n\n      <h2 class=\"h2\">Káva zdražuje a&nbsp;přesto s&nbsp;ní plýtváme<\u002Fh2>\n\n      <p>Na jeden kilogram pražené kávy připadá v průměru zhruba <strong>28 kilogramů oxidu uhličitého<\u002Fstrong>. To ji řadí mezi klimaticky nejnáročnější potraviny vůbec, náročnější než třeba vepřové, kuřecí nebo sýr.<\u002Fp>\n\n      <table class=\"ctable\">\n        <thead>\n          <tr><th>Potravina<\u002Fth><th style=\"text-align:right\">kg CO₂ / kg<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td>Hovězí<\u002Ftd><td class=\"num\">~99<\u002Ftd><\u002Ftr>\n          <tr><td>Tmavá čokoláda<\u002Ftd><td class=\"num\">~47<\u002Ftd><\u002Ftr>\n          <tr class=\"hl\"><td>Káva<\u002Ftd><td class=\"num\">~28<\u002Ftd><\u002Ftr>\n          <tr><td>Sýr<\u002Ftd><td class=\"num\">~24<\u002Ftd><\u002Ftr>\n          <tr><td>Vepřové<\u002Ftd><td class=\"num\">~12<\u002Ftd><\u002Ftr>\n          <tr><td>Kuřecí<\u002Ftd><td class=\"num\">~10<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"snote\">Zdroj: Poore &amp; Nemecek 2018 (Science), přes Our World in Data. Hodnoty jsou kg CO₂ ekvivalentu na kilogram produktu.<\u002Fp>\n\n      <p>Potravinová produkce jako celek stojí zhruba za čtvrtinou všech skleníkových plynů, které lidstvo vypustí. Přesto se ročně vyhodí až <strong>třetina jídla<\u002Fstrong>, což samo vyprodukuje víc emisí než celé letectví.<\u002Fp>\n\n      <p>Pokud vezmeš v potaz, že se ročně vypěstuje zhruba deset milionů tun kávy a na každé kilo připadá 28 kilogramů oxidu uhličitého, je to neuvěřitelné číslo. Poptávka navíc roste, zatímco vhodné plochy pro pěstování ubývá. A přitom se kávou plýtvá.<\u002Fp>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Hádej co<\u002Fdiv>\n        <p>Za napoleonské blokády, kdy do Evropy nebylo možné dovážet kávu, se lidé naučili pražit kořen čekanky, levné plodiny z mírného pásu. Z nouze a kreativity vznikl tradiční nápoj, který milovaly i naše babičky. A pijeme ho dodnes.<\u002Fp>\n      <\u002Fdiv>\n\n      <p>Jak se dočteš v článku <a href=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\" class=\"internal\">Bezkofeinová káva není bez kofeinu<\u002Fa>, decaf vzniká tak, že se vypěstuje běžná káva se vší její klimatickou zátěží a pak následuje další výrobní krok, který z ní kofein odstraní. Krok navíc, který běžná káva nepotřebuje. Z pohledu zdrojů je ta logika zvláštní. Vypěstuješ klimaticky nejnáročnější plodinu a pak z ní průmyslově odstraníš přesně to, kvůli čemu ji pěstuješ. Proč přestáváme být zvědaví a zapomínáme objevovat nové možnosti? Nebo nacházet ty zapomenuté?<\u002Fp>\n\n      <h2 class=\"h2\">Tohle je Pecka. Datlová Pecka.<\u002Fh2>\n\n      <p>V oblasti Perského zálivu se datlové pecky tradičně praží a připravují jako nápoj, arabsky <em>qahwat nawa al-tamr<\u002Fem>. Dnes datlové pecky znovu objevujeme jako plnohodnotnou bezkofeinovou alternativu pro espresso i filtr, kterou zkoumá i potravinářský výzkum.<\u002Fp>\n\n      <p><a href=\"https://tamoje.cz/datlova-pecka-espresso\" class=\"internal\">Datlová Pecka<\u002Fa> je prémiový blend datlových pecek a šesti pečlivě vybraných rostlin. Má karamelově lehkou svěží chuť s ovocnými tóny datlí a připravíš ji přesně tak, jak máš nejraději, jako espresso i filtr. Přirozeně bez kofeinu.<\u002Fp>\n\n      <p>Datlová Pecka je tvá další příležitost setkávat se s přáteli, rodinou i se sebou.<\u002Fp>\n\n      <p>Datle milujeme pro jejich šťavnatost, přirozeně sladkou chuť a přirozený obsah polyfenolů, vlákniny a minerálů jako draslík a hořčík. Napadlo by tě, že pecky, které se běžně vyhazují, ukrývají poklad pro tvůj šálek? Vyrobíme z nich espresso i filtr, a nevypěstujeme ani jedinou rostlinu navíc. <strong>To je smysl upcyklace.<\u002Fstrong><\u002Fp>\n\n      <h2 class=\"h2\">Co si z&nbsp;toho vzít<\u002Fh2>\n\n      <p>Coffee belt, pás kolem rovníku, ve kterém se káva pěstuje, se vlivem klimatu zužuje. Přes polovinu dnes nejvhodnější půdy může do roku 2050 zmizet. Kávovníky se stěhují do vyšších poloh, které ale nejsou nekonečné. Podobný klimatický dopad sledujeme u kakaa, avokáda i čaje.<\u002Fp>\n\n      <p>Káva přitom patří k nejoblíbenějším a zároveň nejnáročnějším plodinám vůbec. Přesto s ní plýtváme. Právě proto je dekofeinizace kávy, tedy proces, při kterém z kávy průmyslově odstraníš přesně to, kvůli čemu ji pěstuješ, kofein, z pohledu zdrojů zvláštní.<\u002Fp>\n\n      <p>I v minulosti svět čelil nedostatku kávy a vystačil si s novou surovinou. S Datlovou Peckou jdeme ještě o krok dál. Upcyklací vytváříme nový způsob, jak si můžeš vychutnat své oblíbené espresso i filtr <strong>s novou chutí, které nikdy není dost.<\u002Fstrong><\u002Fp>\n\n      <!-- FAQ -->\n      <div class=\"faq\">\n        <h2 class=\"h2\" id=\"faq\">Často kladené otázky<\u002Fh2>\n        <div class=\"qa\"><p class=\"q\">Zmizí káva kvůli klimatu úplně?<\u002Fp><p class=\"a\">Ne. Studie mluví o posunu, ne o zániku. Přes polovinu dnes nejvhodnější půdy pro kávu ale může do roku 2050 zmizet a plodina se přesune jinam, kde často poroste hůř.<\u002Fp><\u002Fdiv>\n        <div class=\"qa\"><p class=\"q\">Proč je káva tak náročná na&nbsp;klima?<\u002Fp><p class=\"a\">Roste v úzkém tropickém pásu, potřebuje přesnou teplotu i dost vody a na kilogram patří mezi nejnáročnější potraviny vůbec. Na jeden kilogram pražené kávy připadá kolem 28 kg oxidu uhličitého, víc než na sýr nebo vepřové.<\u002Fp><\u002Fdiv>\n        <div class=\"qa\"><p class=\"q\">Co je datlová káva a&nbsp;proč se o&nbsp;ní mluví?<\u002Fp><p class=\"a\">Je to pražený nápoj z datlových pecek, tedy suroviny, která běžně končí jako krmivo nebo se přehlédne. U nás ji vyrábí tamoje pod jménem Datlová Pecka a dáš si ji jako espresso i filtr. Přirozeně nikdy neobsahovala kofein.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- HODNOCENÍ: interaktivní, ukládá vlastní hlas do prohlížeče -->\n      <div class=\"rating\" data-rating=\"\">\n        <p class=\"rating__label\">Ohodnoť článek<\u002Fp>\n        <div class=\"rating__stars\" role=\"radiogroup\" aria-label=\"Hodnocení článku\">\n          <button type=\"button\" class=\"rating__star\" data-val=\"1\" aria-label=\"1 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"2\" aria-label=\"2 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"3\" aria-label=\"3 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"4\" aria-label=\"4 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"5\" aria-label=\"5 z 5\">★<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"rating__count\" data-rating-msg=\"\">Zatím bez hodnocení. Buď první.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- O AUTORCE -->\n      <div class=\"authorbox\" id=\"autor\">\n        <span class=\"authorbox__avatar\">LM<\u002Fspan>\n        <p class=\"authorbox__role\">O autorce<\u002Fp>\n        <p class=\"authorbox__name\">Lucie Mokrá<\u002Fp>\n        <p class=\"authorbox__bio\">Zakladatelka značky tamoje. Datlovou Pecku vyvinula z touhy dopřát si espresso i filtr kdykoli během dne a přirozeně bez kofeinu. Píše o kávě, kofeinu a životě s ním i bez něj, s oporou v datech a nadšení objevovat nové chutě.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- RELATED -->\n      <div class=\"related\">\n        <h3>Mohlo by tě zajímat<\u002Fh3>\n        <ul>\n          <li><a href=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\">→ Bezkofeinová káva není bez kofeinu: celé spektrum a nové odrůdy<\u002Fa><\u002Fli>\n          <li><a href=\"https://tamoje.cz/blog/bezkofeinova-kava-z-prirody\">→ Bezkofeinová káva a věda: co umí příroda a co laboratoř<\u002Fa><\u002Fli>\n          <li><a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\">→ Co pít místo kávy: 12 alternativ a jak vybrat<\u002Fa><\u002Fli>\n        <\u002Ful>\n        <div class=\"related__all\"><a class=\"related__btn\" href=\"/blog\">Čtení k jádru věci: všechny články <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ZDROJE -->\n      <div class=\"sources\">\n        <h3>Zdroje<\u002Fh3>\n        <p>Grüter et al. 2022 (PLOS ONE) · Bunn et al. 2015 · Davis et al. 2012 a 2019 · Salojärvi et al. 2024 · Rabobank 2026 · IPCC AR6 2022 · Poore &amp; Nemecek 2018 (Science) · Mekonnen &amp; Hoekstra 2011 · UNEP Food Waste Index 2024 · FAO · NOAA Climate.gov · Läderach et al. · Jaramillo et al. 2011 · ICO 2024.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class
