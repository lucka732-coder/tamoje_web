    console.error('Bundle unpack error:', err);

"<!DOCTYPE html>\n<html lang=\"cs\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n\n\n<!-- ===== SEO META ===== -->\n<title>Bezkofeinová káva není bez kofeinu: celé spektrum a nové odrůdy | tamoje</title>\n<meta name=\"description\" content=\"Bezkofeinová káva pořád obsahuje kofein. Projdi metody dekofeinizace, low-caf odrůdy jako Laurinu, proč má robusta víc kofeinu než arabica i kam míří věda.\">\n<meta name=\"keywords\" content=\"bezkofeinová káva, decaf, dekofeinizace, Swiss Water, low-caf, Laurina, Aramosa, kolik kofeinu v decafu, přirozeně bez kofeinu\">\n<link rel=\"canonical\" href=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\">\n\n<meta property=\"og:title\" content=\"Bezkofeinová káva není bez kofeinu: celé spektrum a nové odrůdy | tamoje\">\n<meta property=\"og:description\" content=\"Bezkofeinová káva pořád obsahuje kofein. Projdi metody dekofeinizace, low-caf odrůdy jako Laurinu, proč má robusta víc kofeinu než arabica i kam míří věda.\">\n<meta property=\"og:type\" content=\"article\">\n<meta property=\"og:url\" content=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\">\n<meta property=\"og:image\" content=\"https://tamoje.cz/user/articles/images/bezkofeinova-kava-spektrum-tamoje.jpg\">\n<meta property=\"og:image:alt\" content=\"Zrnková káva a šálek espressa\">\n<meta property=\"og:site_name\" content=\"tamoje\">\n<meta property=\"og:locale\" content=\"cs_CZ\">\n<meta property=\"article:published_time\" content=\"2026-05-23\">\n<meta property=\"article:modified_time\" content=\"2026-07-12\">\n<meta property=\"article:author\" content=\"Lucie Mokrá\">\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large, max-snippet:-1\">\n\n<!-- ===== SCHEMA ===== -->\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"Article\",\n  \"headline\": \"Bezkofeinová káva není bez kofeinu: srovnání decaf, low-caf a dalších novinek\",\n  \"description\": \"Bezkofeinová káva pořád obsahuje kofein. Projdi metody dekofeinizace, low-caf odrůdy jako Laurinu, proč má robusta víc kofeinu než arabica i kam míří věda.\",\n  \"image\": \"https://tamoje.cz/user/articles/images/bezkofeinova-kava-spektrum-tamoje.jpg\",\n  \"author\": {\"@type\": \"Person\", \"name\": \"Lucie Mokrá\", \"jobTitle\": \"zakladatelka\", \"worksFor\": {\"@type\": \"Organization\", \"name\": \"tamoje\"}},\n  \"publisher\": {\"@type\": \"Organization\", \"name\": \"tamoje\", \"logo\": {\"@type\": \"ImageObject\", \"url\": \"https://tamoje.cz/user/logos/tamoje-logo.png\"}},\n  \"datePublished\": \"2026-05-23\",\n  \"dateModified\": \"2026-07-12\",\n  \"mainEntityOfPage\": {\"@type\": \"WebPage\", \"@id\": \"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\"}\n}\n<\/script>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\"@type\": \"Question\", \"name\": \"Je bezkofeinová káva opravdu bez kofeinu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Ne úplně. V EU smí být káva označená jako bezkofeinová, pokud má nejvýše 0,1 % kofeinu u zrnkové (0,3 % u instantní). V praxi to znamená zhruba 2 až 15 mg na šálek. Běžné espresso má kolem 63 až 80 mg. Úplně bez kofeinu bude jen nápoj, který kofein nikdy neobsahoval.\"}},\n    {\"@type\": \"Question\", \"name\": \"Jaký je rozdíl mezi decaf a low-caf?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Decaf je běžná káva, ze které se kofein odstranil (vodou, CO₂ nebo ethylacetátem). Zůstane 2 až 15 mg na šálek. Low-caf je odrůda kávovníku, která přirozeně roste s nižším obsahem kofeinu, třeba Laurina nebo Aramosa. Neprošla žádným procesem, ale kofein pořád obsahuje, zhruba 30 až 55 mg na šálek.\"}},\n    {\"@type\": \"Question\", \"name\": \"Je dekofeinizace chemický proces?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Podle metody. Swiss Water a CO₂ pracují bez rozpouštědel, jen s vodou nebo stlačeným CO₂. Ethylacetát v takzvaném sugar cane decafu pochází z fermentace cukrové třtiny, kde vzniká přirozeně (stejná molekula se dá vyrobit i synteticky). Methylenchlorid je rozpouštědlo, jehož zbytky v kávě EU limituje. Moderní dekofeinizace se výrazně zlepšila.\"}},\n    {\"@type\": \"Question\", \"name\": \"Chutná bezkofeinová káva hůř?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Dekofeinizace chuť ovlivňuje, to platí i u nejšetrnějších metod. Kvalita ale výrazně vzrostla a dobrý decaf dnes v poslepu obstojí vedle běžné kávy.\"}},\n    {\"@type\": \"Question\", \"name\": \"Existuje nápoj přirozeně bez kofeinu, který se připravuje jako káva?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Ano. Datlová Pecka od tamoje je pražený nápoj z datlových pecek a pečlivě vybrané směsi rostlin. Kofein nikdy neobsahovala, žádný proces dekofeinizace nebyl potřeba. Připravíš ji stejně jako espresso, ve filtru i ve French pressu.\"}}\n  ]\n}\n<\/script>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\"@type\": \"ListItem\", \"position\": 1, \"name\": \"tamoje\", \"item\": \"https://tamoje.cz\"},\n    {\"@type\": \"ListItem\", \"position\": 2, \"name\": \"Čtení k jádru věci\", \"item\": \"https://tamoje.cz/blog\"},\n    {\"@type\": \"ListItem\", \"position\": 3, \"name\": \"Bezkofeinová káva není bez kofeinu\"}\n  ]\n}\n<\/script>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b56d8e40-fe52-4500-be8f-96493c0b1c47\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n} kouší vypěstovat kávu úplně bez kofeinu.</li>\n          <li>Jaké nové suroviny zkoumá celý svět?</li>\n        </ul>\n      </div>\n\n      <div class=\"spectrum\">\n        <p class=\"spectrum__label\">Spektrum kofeinu, od plného šálku po nulu</p>\n        <div class=\"spectrum__bar\">\n          <div class=\"sp sp--full\">Běžná káva<br>63 až 80 mg</div>\n          <div class=\"sp sp--low\">Low-caf<br>30 až 55 mg</div>\n          <div class=\"sp sp--decaf\">Decaf<br>2 až 15 mg</div>\n          <div class=\"sp sp--zero\">Přirozeně<br>bez kofeinu</div>\n        </div>\n        <p class=\"spectrum__legend\">Běžná arabica / robusta · Laurina, Aramosa · Dekofeinovaná káva · Bezkofeinové kávovníky (zatím ve výzkumu)</p>\n      </div>\n\n      <h2 class=\"h2\">Lidé přestávají pít kofein</h2>\n      <p>Každým rokem roste počet lidí, kterým kofein v některých chvílích přestává vyhovovat. Tendenci snižovat jeho příjem dnes uvádí až <strong>46 % dospělých</strong> (Euromonitor, 2024). Víc stresu, přemíra podnětů a stimulace v kombinaci s rostoucím zájmem o zdravý životní styl vede k přehodnocení jejich potřeb. Poohlíží se po možném řešení a kávový průmysl na to samozřejmě reaguje. Začal kofein z kávy odstraňovat. Tak vznikla dekofeinizace. Jaké alternativy kávy jsou nejčastěji vyhledávány se dočteš v <a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\" class=\"internal\">Co pít místo kávy: 12 alternativ a jak vybrat</a>.</p>\n\n      <h2 class=\"h2\">Správně je dekofeinovaná káva</h2>\n      <p>Slovo „bezkofeinová“ trochu klame a svádí nás k úlevě, že tohle můžu kdykoliv. Kofein ale obsahuje. Jak je to možné?</p>\n      <p>Bezkofeinová káva, tzv. decaf, je káva, která prošla procesem dekofeinizace, tedy umělého odstranění kofeinu. V EU smí být káva takto označená, pokud má nejvýš 0,1&nbsp;% kofeinu (u instantní dokonce 0,3&nbsp;%). Pro šálek espressa to znamená zhruba <strong>2 až 15 mg kofeinu</strong>, podle odrůdy a metody dekofeinizace. Pro srovnání, běžné espresso má kolem 63 až 80 mg. Nejedná se o absenci kofeinu, ale jeho výraznou redukci. Způsobů je spousta a my si postupně projdeme, jak se to dělá.</p>\n\n      <h2 class=\"h2\">Jak vzniká bezkofeinová káva?</h2>\n      <p>Extrakcí kofeinových molekul jsou z kávových zrn odebírány její povzbudivé látky. Metod je celá řada. Rozlišujeme chemické i mechanické a liší se také v tom, jak moc ovlivní výslednou chuť. Vedle levnějších chemických způsobů jsou dnes známé i šetrnější, zato dražší metody, žádná z nich ale kofein neodstraní úplně.</p>\n      <p>Ať zvolíš kteroukoli metodu, výsledek je podobný. Každá odstraní zhruba 97&nbsp;% kofeinu. Metody se liší hlavně cenou, tím, co udělají s chutí, a také kolik vody a energie navíc se spotřebuje. Projdeme je od té nejméně šetrné po nejšetrnější.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Rozpouštědlo · nejlevnější</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">Methylenchlorid</h3>\n      <p>Historicky nejpoužívanější a nejlevnější metoda, proto se s ní dělá masově vyráběný decaf. Rozpouštědlo naváže kofein a odpaří se, jeho zbytky v hotové kávě EU limituje (dnes směrnice 2009/32/ES). Zároveň je to metoda, která chuti ubližuje nejvíc, právě ta plochá, lehce léčivá pachuť dala běžnému decafu jeho starou špatnou pověst. Háček je i v tom, že se na etiketě většinou neuvádí: když u decafu není napsáno nic, bývá to nejčastěji tahle. Kdo si chce vybrat líp, hledá „Swiss Water“, „CO₂“ nebo „sugar cane“.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Přírodní rozpouštědlo · levnější</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">Ethylacetát (sugar cane decaf)</h3>\n      <p>Název zní chemicky, ale u takzvaného sugar cane decafu pochází ethylacetát z fermentace cukrové třtiny, kde vzniká přirozeně, a najdeš ho i v ovoci. Stejná molekula se sice dá vyrobit i synteticky, u kvalitního decafu se proto uvádí právě původ „sugar cane“. Chuťově patří k lepším: drží těkavá aromata a přírodní cukry, takže bývá sladká, kulatá a čistá, i když někdo v ní rozpozná jemnou pachuť. Cenově je dostupnější než vodní i CO₂ metody.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Voda a uhlík · bez rozpouštědel</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">Swiss Water a Mountain Water</h3>\n      <p>Zelená zrna se namáčí ve vodě nasycené kávovými výtažky, kofein přechází do vody a zachytí ho uhlíkové filtry. Žádné rozpouštědlo. Je ceněná pro čistotu a šetrnost k chuti, dobrý Swiss Water decaf v poslepu obstojí vedle běžné kávy, a voda se v provozu z velké části recykluje. Náročnější proces se ale promítá do ceny, bývá výrazně dražší než rozpouštědlové metody. Poznávacím znakem je lehce skvrnitý povrch zrn.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Stlačený plyn · nejšetrnější k chuti</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">CO₂ (oxid uhličitý pod tlakem)</h3>\n      <p>Stlačený CO₂ se za specifického tlaku a teploty naváže selektivně na kofein a aromatické látky nechá skoro netknuté. Podle roasterů a degustátorů drží chuť nejlíp ze všech metod. Cenu ale platíš: nákladné vysokotlaké zařízení provozuje jen pár závodů na světě, takže je to nejdražší cesta a najdeš ji hlavně u prémiových pražíren.</p>\n\n      <h2 class=\"h2\">Proč dala příroda kávě kofein a&nbsp;proč víc Robustě než Arabice</h2>\n      <p>Než se dostaneme k nízkokofeinovým odrůdám kávy, řekněme si, co je vlastně kofein? Kofeinem se rostliny kávovníku a také čajovníku chrání před škůdci. Je to přírodní pesticid, který zabraňuje okusování listů rostlin hmyzem a v půdě brzdí klíčení konkurenčních rostlin.</p>\n      <p>A vše do sebe krásně zapadá, když se více zaměříme na rozdíl mezi Arabicou a Robustou. Každá roste v jiné nadmořské výšce a každá tak potřebuje jinou míru ochrany před škůdci. Robusta roste v nízkých výškách od zhruba 300 m n.m., v horku a vlhkém prostředí plném hmyzu a hub. Proto Robusta obsahuje kolem 2,2 až 2,7 % kofeinu. Oproti tomu Arabica roste ve výšce 600 až 1&nbsp;800 m n.m., v chladnějším prostředí a vystačí si s 1,2 až 1,5 %, tedy zhruba polovinou.</p>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Zajímavost</div>\n        <p>Kofein je pro rostliny zbraň, ale hlavního škůdce kávy, lýkohuba kávového, nezastaví. Brouk se kofeinu přizpůsobil a rozkládá ho pomocí bakterií ve střevě. Kávovník kofeinem přiotravuje dokonce i vlastní klíčící semena.</p>\n      </div>\n\n      <h2 class=\"h2\">Nízkokofeinové odrůdy, tzv.&nbsp;Low-caf</h2>\n      <p>Některé odrůdy kávovníku obsahují nižší množství kofeinu přirozeně. Není zde žádný proces dekofeinizace, jen příroda a genetika, ale kofeinu je zde více než v decaf.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Low-caf odrůda</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">Laurina (Bourbon Pointu)</h3>\n      <p class=\"snote\" style=\"margin:0 0 14px\">Kofein: ~0,6 % (vs. ~1,2 až 1,5 % u arabicy) · ≈ 30 až 40 mg / šálek</p>\n      <p>Přirozená mutace odrůdy Bourbon byla poprvé objevena na ostrově Réunion. Je jemná, sladká, s tóny fíků, hrušky a vanilky a chuťově je blíž čaji než espressu. Pěstuje se těžko, protože, jak jsme již zmínili, nižší obsah kofeinu znamená i nižší odolnost proti škůdcům. Je vzácná a drahá. Výnos této křehké odrůdy je jen 30 až 40 % oproti běžnému Bourbonu, proto patří k nejdražším kávám vůbec. Cena se uvádí i 10 tisíc korun za kilo a u nás ji seženeš jen u mála specialty pražíren.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Low-caf odrůda</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">Aramosa</h3>\n      <p class=\"snote\" style=\"margin:0 0 14px\">Kofein: ~0,6 až 0,8 % (vs. ~1,2 až 1,5 % u arabicy) · Kříženec Arabica × Coffea racemosa</p>\n      <p>Zatímco Laurina je náhoda přírody, Aramosa je cílený kříženec. Vznikla spojením arabicy s divokým druhem <em>Coffea racemosa</em>, který roste na jihovýchodě Afriky (Mozambik) a kofeinu má přirozeně málo. Cíl brazilských šlechtitelů (farma Daterra a Agronomický institut v Campinas): vzít z racemosy nízký kofein a odolnost vůči suchu, z arabicy chuť. Je to slibný pokus, jak mít kávu s nižším kofeinem, která navíc líp zvládne oteplování. Pořád je to ale káva, kofein obsahuje.</p>\n\n      <p>Za zmínku stojí i <em>Coffea eugenioides</em>, dávný předek dnešní arabicy. Přirozeně má zhruba jen <strong>třetinu kofeinu</strong> a sladší chuť. Běžně se nepěstuje, je to spíš genetická rarita, kterou vědci využívají ve šlechtění.</p>\n\n      <h2 class=\"h2\">Celé spektrum na&nbsp;jednom místě</h2>\n\n      <div class=\"ctable-wrap\"><table class=\"ctable\">\n        <thead>\n          <tr><th>Metoda / odrůda</th><th>Kofein / šálek</th><th>Dostupnost v ČR</th></tr>\n        </thead>\n        <tbody>\n          <tr><td><strong>Robusta</strong></td><td>zhruba 2× víc než arabica</td><td>Levné směsi, instantní</td></tr>\n          <tr><td><strong>Arabica, espresso</strong></td><td>63 až 80 mg</td><td>Všude</td></tr>\n          <tr><td><strong>Arabica, filtr</strong></td><td>cca 95 až 140 mg</td><td>Všude</td></tr>\n          <tr><td><strong>Laurina</strong> (low-caf)</td><td>30 až 40 mg</td><td>Vzácná, specialty</td></tr>\n          <tr><td><strong>Aramosa</strong> (low-caf)</td><td>~35 až 50 mg</td><td>Velmi vzácná</td></tr>\n          <tr><td>Swiss / Mountain Water</td><td>2 až 15 mg</td><td>Specialty e‑shopy</td></tr>\n          <tr><td>CO₂</td><td>2 až 15 mg</td><td>Vybrané pražírny</td></tr>\n          <tr><td>Ethylacetát (sugar cane)</td><td>2 až 15 mg</td><td>Specialty e‑shopy</td></tr>\n          <tr><td>Methylenchlorid</td><td>2 až 15 mg</td><td>Běžná, supermarkety</td></tr>\n        </tbody>\n      </table></div>\n      <p class=\"snote\">Zdroje: EFSA 2015, USDA FoodData Central, Swiss Water, Barista Magazine (metody dekofeinizace); obsah kofeinu arabica/robusta a obranná funkce (CIRAD, botanická literatura); lýkohub a kofein (Ceja-Navarro a kol., Nature Communications 2015). Datlová Pecka: přirozeně bez kofeinu (datlová pecka kofein neobsahuje).</p>\n\n      <h2 class=\"h2\">Kam míří věda: bezkofeinová káva z&nbsp;laboratoře</h2>\n      <p>Vedle dekofeinizace kávových zrn je aktuální ještě jedna, mnohem zajímavější cesta. Šlechtění kávy k přirozeně nulovému obsahu kofeinu. Jak se zkoumá schopnost „vypnout“ v kávě gen kofeinové ochrany, se dočteš v samostatném článku.</p>\n\n      <h2 class=\"h2\">Svět mluví o&nbsp;datlové kávě</h2>\n      <p>Svou roli hraje i udržitelnost. Dekofeinizace má environmentální daň, je to výrobní krok navíc a káva se k němu často veze přes půl světa do specializovaného provozu. A samotná káva stojí planetu nejvíc už na plantáži, v pěstování, hnojení a dopravě. Není divu, že čím dál víc lidí hledá i šetrnější možnosti.</p>\n      <p>Chceme se nadále setkávat u společného stolu se svými přáteli a rodinou bez ohledu na to, jestli kofein můžeme nebo ne, a nepřijít o příležitost dopřávat si spolu oblíbené espresso nebo filtr. Proč se ve světě čím dál víc mluví o datlové kávě zjistíš v našem článku <a href=\"/blog/klimaticka-zmena-a-datlova-kava\" class=\"internal\">Pěstování kávy a klima: proč mizí půda a vzniká datlová káva?</a>.</p>\n      <p>Datlová káva ale není jen trendem ve světě. U nás ji vyrábí firma tamoje, jmenuje se Datlová Pecka a můžeš si ji dát jako espresso i filtr.</p>\n\n      <p><a href=\"/\" class=\"internal\">Datlová Pecka</a> je prémiový blend datlových pecek a šesti pečlivě vybraných rostlin. Má karamelově lehkou svěží chuť s ovocnými tóny datlí a připravíš ji přesně tak, jak máš nejraději, jako espresso i filtr.</p>\n\n      <p>Datlová pecka je tvá další příležitost setkávat se s přáteli, rodinou i se sebou.</p>\n\n      <h2 class=\"h2\">Co si z&nbsp;toho vzít</h2>\n      <p>„Bezkofeinová“ káva není nula, ale výrazná redukce, v šálku zůstanou zhruba 2 až 15 mg. Metody dekofeinizace se liší hlavně cenou a tím, co udělají s chutí, a když si chceš vybrat líp, hledej na etiketě „Swiss Water“, „CO₂“ nebo „sugar cane“. Nižší kofein mají i některé odrůdy, takzvané low-caf, ale ani ty nejsou úplně bez něj. A pak je tu úplně jiná cesta: sáhnout po surovině, která kofein nikdy neměla.</p>\n\n      <!-- FAQ -->\n      <div class=\"faq\">\n        <h2 class=\"h2\" id=\"faq\">Často kladené otázky</h2>\n        <div class=\"qa\"><p class=\"q\">Je bezkofeinová káva opravdu bez&nbsp;kofeinu?</p><p class=\"a\">Ne úplně. V EU smí být káva označená jako bezkofeinová, pokud má nejvýš 0,1 % kofeinu u zrnkové (0,3 % u instantní), v šálku to dělá zhruba 2 až 15 mg. Běžné espresso má kolem 63 až 80 mg. Úplně bez kofeinu bude jen nápoj, který kofein nikdy neobsahoval.</p></div>\n        <div class=\"qa\"><p class=\"q\">Jaký je rozdíl mezi decaf a&nbsp;low-caf?</p><p class=\"a\">Decaf je běžná káva, ze které se kofein odstranil (vodou, CO₂ nebo ethylacetátem). Low-caf je odrůda, která přirozeně roste s nižším kofeinem, třeba Laurina nebo Aramosa. Neprošla žádným procesem, ale kofein pořád obsahuje, zhruba 30 až 55 mg na šálek.</p></div>\n        <div class=\"qa\"><p class=\"q\">Je dekofeinizace chemický proces?</p><p class=\"a\">Podle metody. Swiss Water a CO₂ pracují bez rozpouštědel. Ethylacetát v takzvaném sugar cane decafu pochází z fermentace cukrové třtiny, kde vzniká přirozeně (stejná molekula se dá vyrobit i synteticky). Methylenchlorid je rozpouštědlo, jehož zbytky v kávě EU limituje.</p></div>\n        <div class=\"qa\"><p class=\"q\">Chutná bezkofeinová káva hůř?</p><p class=\"a\">Dekofeinizace chuť ovlivňuje, to platí i u nejšetrnějších metod. Kvalita ale výrazně vzrostla a dobrý decaf dnes v poslepu obstojí vedle běžné kávy.</p></div>\n        <div class=\"qa\"><p class=\"q\">Existuje nápoj přirozeně bez&nbsp;kofeinu, který se připravuje jako káva?</p><p class=\"a\">Ano. Datlová Pecka od tamoje je pražený nápoj z datlových pecek a pečlivě vybrané směsi rostlin. Kofein nikdy neobsahovala. Připravíš ji stejně jako espresso, ve filtru i ve French pressu.</p></div>\n      </div>\n\n      <!-- HODNOCENÍ: interaktivní, ukládá vlastní hlas do prohlížeče -->\n      <div class=\"rating\" data-rating=\"\">\n        <p class=\"rating__label\">Ohodnoť článek</p>\n        <div class=\"rating__stars\" role=\"radiogroup\" aria-label=\"Hodnocení článku\">\n          <button type=\"button\" class=\"rating__star\" data-val=\"1\" aria-label=\"1 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"2\" aria-label=\"2 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"3\" aria-label=\"3 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"4\" aria-label=\"4 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"5\" aria-label=\"5 z 5\">★</button>\n        </div>\n        <p class=\"rating__count\" data-rating-msg=\"\">Zatím bez hodnocení. Buď první.</p>\n      </div>\n\n      <!-- O AUTORCE -->\n      <div class=\"authorbox\" id=\"autor\">\n        <span class=\"authorbox__avatar\">LM</span>\n        <p class=\"authorbox__role\">O autorce</p>\n        <p class=\"authorbox__name\">Lucie Mokrá</p>\n        <p class=\"authorbox__bio\">Zakladatelka značky tamoje. Datlovou Pecku vyvinula z touhy dopřát si espresso i filtr kdykoli během dne a přirozeně bez kofeinu. Píše o kávě, kofeinu a životě s ním i bez něj, s oporou v datech a nadšení objevovat nové chutě.</p>\n      </div>\n\n      <!-- RELATED -->\n      <div class=\"related\">\n        <h3>Mohlo by tě zajímat</h3>\n        <ul>\n          <li><a href=\"/blog/bezkofeinova-kava-z-prirody\">→ Bezkofeinová káva a věda: co umí příroda a co laboratoř</a></li>\n          <li><a href=\"/blog/kava-v-tehotenstvi-co-rika-veda\">→ Kofein v těhotenství: Co věda opravdu ví a co ještě ne</a></li>\n          <li><a href=\"/blog/kofein-a-hormony\">→ Kofein a hormony: proč na tebe působí káva jinak</a></li>\n        </ul>\n        <div class=\"related__all\"><a class=\"rela
