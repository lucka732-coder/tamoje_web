"<!DOCTYPE html>\n<html lang=\"cs\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n\n\n<!-- ===== SEO META ===== -->\n<title>Kofein a hormony: proč na ženy působí káva jinak | tamoje</title>\n<meta name=\"description\" content=\"Proč na tebe káva působí jinak než na ostatní? Jak hormony mění rychlost, jakou odbouráš kofein během cyklu, s antikoncepcí a během menopauzy.\">\n<meta name=\"keywords\" content=\"kofein a hormony, káva a menstruace, kofein a antikoncepce, jak dlouho vydrží kofein v těle, kofein a ženské tělo, káva a železo\">\n<link rel=\"canonical\" href=\"https://tamoje.cz/blog/kofein-a-hormony\">\n\n<meta property=\"og:title\" content=\"Kofein a hormony: proč na ženy působí káva jinak | tamoje\">\n<meta property=\"og:description\" content=\"Proč na tebe káva působí jinak než na ostatní? Jak hormony mění rychlost, jakou odbouráš kofein během cyklu, s antikoncepcí a během menopauzy.\">\n<meta property=\"og:type\" content=\"article\">\n<meta property=\"og:url\" content=\"https://tamoje.cz/blog/kofein-a-hormony\">\n<meta property=\"og:image\" content=\"https://tamoje.cz/user/articles/images/kofein-a-hormony-tamoje.jpg\">\n<meta property=\"og:image:alt\" content=\"Šálek na stole vedle diáře s vyznačeným cyklem\">\n<meta property=\"og:site_name\" content=\"tamoje\">\n<meta property=\"og:locale\" content=\"cs_CZ\">\n<meta property=\"article:published_time\" content=\"2026-07-12T09:00:00+02:00\">\n<meta property=\"article:modified_time\" content=\"2026-07-12T09:00:00+02:00\">\n<meta property=\"article:author\" content=\"Lucie Mokrá\">\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large, max-snippet:-1\">\n\n<!-- ===== SCHEMA ===== -->\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"Article\",\n  \"headline\": \"Kofein a ženské tělo: jak hormony mění účinek kávy během cyklu, s antikoncepcí a v období menopauzy\",\n  \"description\": \"Proč na tebe káva působí jinak než na ostatní? Jak hormony mění rychlost, jakou odbouráš kofein během cyklu, s antikoncepcí a během menopauzy.\",\n  \"image\": \"https://tamoje.cz/user/articles/images/kofein-a-hormony-tamoje.jpg\",\n  \"author\": {\"@type\": \"Person\", \"name\": \"Lucie Mokrá\", \"jobTitle\": \"zakladatelka\", \"worksFor\": {\"@type\": \"Organization\", \"name\": \"tamoje\"}},\n  \"publisher\": {\"@type\": \"Organization\", \"name\": \"tamoje\", \"logo\": {\"@type\": \"ImageObject\", \"url\": \"https://tamoje.cz/user/logos/tamoje-logo.png\"}},\n  \"datePublished\": \"2026-07-12T09:00:00+02:00\",\n  \"dateModified\": \"2026-07-12T09:00:00+02:00\",\n  \"mainEntityOfPage\": {\"@type\": \"WebPage\", \"@id\": \"https://tamoje.cz/blog/kofein-a-hormony\"}\n}\n<\/script>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\"@type\": \"Question\", \"name\": \"Proč ženy metabolizují kofein jinak než muži?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Kofein odbourává hlavně jaterní enzym CYP1A2 a jeho rychlost brzdí estrogen. Protože hladina estrogenu se u žen mění během cyklu, na antikoncepci, v těhotenství i po menopauze, mění se i rychlost, jakou tělo kofein zpracuje. U mužů je hormonální profil stabilnější, takže i metabolismus kofeinu je vyrovnanější.\"}},\n    {\"@type\": \"Question\", \"name\": \"Vydrží kofein v těle déle, když beru hormonální antikoncepci?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Ano. U žen užívajících kombinovanou hormonální antikoncepci se poločas kofeinu prodlužuje zhruba z 5,4 na 7,9 hodiny, tedy asi o 47 procent (Abernethy a Todd, 1985). Odpolední káva tak může narušit spánek víc, než bys čekala, protože ji máš v těle déle.\"}},\n    {\"@type\": \"Question\", \"name\": \"Mám před menstruací omezit kávu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Z hlediska metabolismu kofeinu to nutné není. Rychlost, jakou tělo kofein odbourává, se mezi folikulární a luteální fází cyklu mění tak málo, že to nemá praktický význam (Lane et al., 2000). Rozšířená rada „před menstruací omez kávu\" nemá v datech oporu.\"}},\n    {\"@type\": \"Question\", \"name\": \"Bere káva z těla železo?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Jen za určitých podmínek. Káva ke jídlu snižuje vstřebávání nehemového (rostlinného) železa, hemové železo z masa skoro neovlivní. Rozhoduje načasování: káva vypitá zhruba hodinu před jídlem vstřebávání železa nesnížila vůbec. Slavné „minus 66 procent\" navíc patří spíš čaji (64 procent), u kávy šlo o 39 procent (Morck et al., 1983).\"}},\n    {\"@type\": \"Question\", \"name\": \"Spouští káva migrénu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Podle nejnovějších dat spíše ne. Studie, které umí líp oddělit příčinu od náhodné souvislosti, kofein jako spouštěč migrény nepotvrzují. Co ji naopak umí spustit, je náhlé vysazení kofeinu, tedy takzvaná odvykací bolest hlavy.\"}},\n    {\"@type\": \"Question\", \"name\": \"Proč mi v těhotenství přestala chutnat káva?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"V prvním trimestru prudce stoupají těhotenské hormony (hCG a estrogen) a s nimi se zostřuje čich, takže silné vůně včetně kávy mohou být najednou nepříjemné. Podle studie z roku 2004 kávu v prvním trimestru omezí nebo úplně vysadí až 96 procent žen. Roli nejspíš hraje i to, že kofein je od přírody hořký, a hořkost v nás odjakživa evokuje opatrnost.\"}}\n  ]\n}\n<\/script>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\"@type\": \"ListItem\", \"position\": 1, \"name\": \"tamoje\", \"item\": \"https://tamoje.cz\"},\n    {\"@type\": \"ListItem\", \"position\": 2, \"name\": \"Čtení k jádru věci\", \"item\": \"https://tamoje.cz/blog\"},\n    {\"@type\": \"ListItem\", \"position\": 3, \"name\": \"Kofein a hormony\"}\n  ]\n}\n<\/script>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0e513ab2-7a05-4c65-966a-ab885b848ae1\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4ce812fc-e97a-41bb-9fd4-9b1ec86ec475\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ad5652ba-ca64-4c29-b88c-6167284e8a42\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a74b7777-fb97-46b3-9a5e-66b4ccff05ed\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7cef475e-e083-43f9-81c9-188e2dcf54ba\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font 3DVgSSRCMEde6E3gR17oSSQLwI790KQw8d+7+7SSRKbwWXt+7ThjWjQdEklqBDZPXl/fRJJVk3JNzP75pJIiPhtI1CrdDHXuhJJUV+BHfuhOcPHQ8qSSBxh49fLz/VTbhoqHl/eiSSQTGGio+Xl+qmMJDm9xJJA4wkNe7+6S+yxV7qSStIb7HDY8qk3CQ0PKkkiLI8FA46sRAwGHDf8MH1SSWma//Z\" alt=\"Tři ženy různého věku zezadu s pozvednutými pažemi na béžovém pozadí — kofein a ženské tělo napříč životem\">\n\n      <p class=\"perex\"><strong>Dáš si s&nbsp;kámoškou ve stejné chvíli stejné cappuccino a&nbsp;ona usne bez problému, ale ty zíráš do stropu do dvou do rána? A&nbsp;co vaše menstruační fáze, jsou stejné?</strong></p>\n      <p>Moc se o&nbsp;tom nemluví, ale rychlost, jakou tvoje tělo odbourává kofein, se mění stejně jako tvoje hladina estrogenu. Jak to funguje, se dozvíš v&nbsp;článku.</p>\n\n      <div class=\"tldr\">\n        <h3 class=\"tldr__label\">Zde se dočteš, že:</h3>\n        <ul>\n          <li>Kofein odbourává hlavně jaterní enzym <strong>CYP1A2</strong> a jeho aktivitu tlumí právě <strong>estrogen</strong>. Čím víc estrogenu, tím déle tělo kofein drží.</li>\n          <li><strong>Poločas kofeinu</strong>, tedy čas, za který se tělo zbaví právě poloviny jeho množství, se při užívání hormonální antikoncepce prodlužuje skoro o 50 %, během těhotenství se až trojnásobně zpomalí (v závislosti na jeho fázi) a v menopauze se naopak zase zrychlí.</li>\n          <li>Mezi <strong>folikulární a luteální fází</strong> cyklu, tedy v jeho první a druhé polovině, se odbourávání kofeinu prakticky nemění. Na obecnou radu „před menstruací omez kávu“ se nespoléhej.</li>\n          <li>Část toho, co ženy o kávě slýchají v souvislosti se železem, citlivostí prsou nebo plodností, novější data nepotvrzují.</li>\n        </ul>\n      </div>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Než začneš číst</div>\n        <p>Tento článek shrnuje data z&nbsp;primárních zdrojů, má informativní charakter a&nbsp;nenahrazuje radu lékaře. Nedává doporučení, kolik kofeinu si dopřát. O&nbsp;antikoncepci, těhotenství, plánování miminka, migréně nebo obtížích v&nbsp;menopauze se poraď se svým lékařem.</p>\n      </div>\n\n      <h2 class=\"h2\">Jak spolu souvisí estrogen a&nbsp;jaterní enzym?</h2>\n      <p>Než se dostaneme ke kávě, v krátkosti si ujasněme dva pojmy: hormon <strong>estrogen</strong> a jaterní enzym <strong>CYP1A2</strong>, který kofein odbourává.</p>\n      <p>Estrogen je primárně ženský pohlavní hormon. Jeho hlavní formou je estradiol a řídí menstruační cyklus. Hladina hormonů není stálá, mění se v přesném rytmu. V první polovině cyklu, ve folikulární fázi, hladina estradiolu v těle stoupá až do fáze ovulace. Po ní, v luteální fázi, hladina kolísá a těsně před menstruací jeho hladina prudce padá. V těhotenství pak hladina estrogenu mnohonásobně roste a drží se vysoko, zatímco po menopauze produkce ve vaječnících klesá a zůstává trvale nízká.</p>\n      <p>Enzymy jsou bílkoviny, které v těle urychlují chemické reakce, samy se přitom nespotřebují. Kofein v těle rozkládá systém jaterních enzymů (cytochrom P450) a naprostou většinu práce, více než 90 %, obstará jediný z nich, <strong>CYP1A2</strong>. Ten kofein přeměňuje hlavně na látku zvanou paraxantin, kterou tělo dál zpracuje a vyloučí. Jak je tento enzym aktivní, záleží z části na genech, výrazně ho ovlivňuje i kouření, které jeho rychlost umí až zdvojnásobit, a také strava. O vlivu genů na odbourávání kofeinu se dočteš v našem článku <a href=\"/blog/kava-v-tehotenstvi-co-rika-veda\" class=\"internal\">Kofein v těhotenství: co už věda opravdu ví a co ještě ne</a>. Pokud chceš vědět, jak s tímto procesem souvisí hormony, čti dál.</p>\n      <p><strong>Estrogen aktivitu enzymu CYP1A2 tlumí</strong>, odborně řečeno ho inhibuje. Prakticky řečeno, čím víc estrogenu v těle máš, tím pomaleji tento odbourávač kofeinu pracuje a tím déle kofein v těle zůstává. Zní to jako detail, ale právě kvůli němu má na tebe káva v různých obdobích života různý vliv a může se dít, že to, co jsi dříve milovala najednou nebudeš moct ani cítit.</p>\n      <p>Poprvé to pěkně ukázali už v roce 1999. Ženám po menopauze podávali estrogen a jejich tělo začalo kofein odbourávat pomaleji, o 29 procent (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/10471985/\" target=\"_blank\" rel=\"noopener\">Pollock et al., 1999</a>). Novější přehled z roku 2025 to shrnuje jasně: estrogen odbourávání kofeinu zpomaluje, a když po menopauze hormon klesne, metabolismus kofeinu se zase zrychlí (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12411768/\" target=\"_blank\" rel=\"noopener\">Farinetti et al., J Geriatr Cardiol 2025</a>).</p>\n      <p>Hladina estrogenu se mění během cyklu, při antikoncepci, v těhotenství i po menopauze a tím se zásadně mění rychlost, jakou tvé tělo kávu odbourává. Pojď to projít fázi po fázi.</p>\n\n      <h2 class=\"h2\">Kofein napříč tvým hormonálním životem</h2>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Menstruační cyklus</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">1)&nbsp;Musíš před menstruací omezit kávu? Nemusíš.</h3>\n      <p>Mezi ženami koluje rada, že v druhé polovině cyklu je potřeba s kávou přibrzdit. Data to ale nepotvrzují. Rychlost, jakou tělo kofein odbourává, se mezi první a druhou polovinou cyklu (tedy před ovulací a po ní, čemuž se odborně říká folikulární a luteální fáze) mění tak málo, že to nemá prakticky žádný význam (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/10839467/\" target=\"_blank\" rel=\"noopener\">Lane et al., 2000</a>). Samotný cyklus s tvým kofeinem nehýbe.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Hormonální antikoncepce</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">2)&nbsp;S kombinovanou antikoncepcí ti káva vydrží skoro o polovinu déle</h3>\n      <p>Do přirozeného ženského hormonálního rytmu výrazně zasahuje hormonální antikoncepce a řada žen ani netuší jak moc. Kombinovaná antikoncepce potlačí ovulaci a s ní i přirozené kolísání hormonů. Místo něj dodává tělu stálou dávku syntetického estrogenu (ethinylestradiolu) a gestagenu a drží tak hormony uměle v nepřirozeně stabilní hladině. V týdnu bez antikoncepce pak dochází k jejich náhlému poklesu a jak za chvíli zjistíš, i tento syntetický estrogen zasahuje do odbourávání kofeinu.</p>\n      <p>U žen užívajících kombinovanou hormonální antikoncepci se poločas kofeinu, tedy čas, za který z těla zmizí jeho polovina, prodlužuje zhruba z 5,4 na 7,9 hodiny (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/4029248/\" target=\"_blank\" rel=\"noopener\">Abernethy a Todd, 1985</a>).</p>\n      <div class=\"stat\">\n        <div class=\"stat__num\">+47 %</div>\n        <div class=\"stat__txt\">Zhruba o tolik procent ti zůstává kofein v těle déle při užívání kombinované hormonální antikoncepce. V hodinách je to rozdíl zhruba dvě a půl hodiny.</div>\n      </div>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Těhotenství</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">3)&nbsp;Největší rozdíl je během těhotenství</h3>\n      <p>V průběhu těhotenství estrogen prudce roste a rychlost enzymu CYP1A2 se výrazně zpomaluje. Jeho aktivita klesá zhruba o 33 % v prvním trimestru, o 48 % ve druhém a o 65 % ve třetím (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5564294/\" target=\"_blank\" rel=\"noopener\">Yu et al., 2015</a>). Poločas kofeinu se tak ke konci těhotenství protahuje z běžných čtyř až pěti hodin až na zhruba patnáct hodin (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12526311/\" target=\"_blank\" rel=\"noopener\">přehledová studie, Nutrients 2025</a>). Kofein se v těle drží a hromadí.</p>\n      <p>To je i hlavní důvod, proč se v těhotenství doporučuje s kávou opatrně. Celé jsme to rozebrali v článku <a class=\"internal\" href=\"/blog/kava-v-tehotenstvi-co-rika-veda\">Kofein v těhotenství: Co věda opravdu ví a co ještě ne</a>.</p>\n      <p>Další situace, kterou zná spousta žen na vlastní kůži, je, že řadě z nich začne v prvním trimestru káva vadit. Předtím ji milovaly a najednou ji nemůžou doslova ani cítit. Děje se to přesně ve chvíli, kdy prudce stoupají těhotenské hormony (hlavně hCG a estrogen), s čímž souvisí i zbystření čichu. Podle studie z roku 2004 v prvním trimestru kávu omezí nebo úplně vysadí až 96 % žen a dvě třetiny z nich cítí přímo odpor (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/15219624/\" target=\"_blank\" rel=\"noopener\">Changes in caffeine consumption as a signal of pregnancy, 2004</a>).</p>\n      <p>Může to být logičtější, než se zdá. Kofein je od přírody pořádně hořký, protože je přirozená ochrana rostlin před škůdci. Je to přírodní pesticid, který svou hořkou chutí odrazuje hmyz od okusování rostlin kávovníku i čajovníku a vyšší dávka ho dokonce paralyzuje (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/6207592/\" target=\"_blank\" rel=\"noopener\">Nathanson, Science 1984</a>; <a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11432278/\" target=\"_blank\" rel=\"noopener\">Kurek et al., 2024</a>).</p>\n      <p>U lidí hořkost odjakživa evokuje něco, před čím je lepší mít se na pozoru. Řada rostlinných toxinů byla odjakživa hořká a schopnost rozpoznat je se po tisíce let vyplácela (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8830313/\" target=\"_blank\" rel=\"noopener\">Wooding et al., 2021</a>). S trochou nadsázky se pak můžeme i zamyslet nad tím, proč děti tak ohrnují nos nad vším hořkým. Je to instinkt? Když se pak v těhotenství čich i chuť zbystří, nebylo by překvapením, kdyby nechuť ke kávě souvisela s dávnou, evolučně danou ostražitostí.</p>\n\n      <div class=\"camp__label\" style=\"margin-top:34px\">Menopauza</div>\n      <h3 class=\"grp\" style=\"margin-top:2px\">4)&nbsp;Po menopauze se karta obrací</h3>\n      <p>Když estrogen během menopauzy klesne, enzym CYP1A2 může zase pracovat naplno a kofein začneš odbourávat rychleji než dřív (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12411768/\" target=\"_blank\" rel=\"noopener\">Farinetti et al., 2025</a>). Kofeinu tak teoreticky „uneseš“ víc.</p>\n      <p>Rozhodně stojí za pozornost průřezová studie, během které byly na 1&nbsp;806 ženách zkoumány souvislosti mezi kofeinem a obtížnějšími návaly a nočním pocením během menopauzy (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/25051286/\" target=\"_blank\" rel=\"noopener\">Faubion et al., Menopause 2015</a>). Jedná se ale zatím o jedinou studii svého druhu a zkoumala pouze souvislosti, ne průkaznost příčin. Jestli tě návaly trápí, určitě se obrať na svého lékaře, který ti toto období pomůže zvládnout.</p>\n\n      <h2 class=\"h2\">Káva a&nbsp;železo: záleží na&nbsp;tom, kdy ji piješ</h2>\n      <p>Tohle je nejrozšířenější strašák a zároveň nejlíp vysvětlitelný. Ano, káva umí snížit vstřebávání železa, ale jen nehemového, tedy toho rostlinného (luštěniny, listová zelenina, obiloviny). Hemové železo z masa skoro neovlivní. Za efektem stojí polyfenoly, přírodní látky obsažené v kávě, čaji i víně, které se na železo v trávení navážou a část ho zablokují, což potvrzuje i meta-analýza 34 studií, <a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/33871598/\" target=\"_blank\" rel=\"noopener\">Xu et al., z roku 2021</a>.</p>\n      <p>Existují také zdroje, které uvádějí, že káva snižuje vstřebávání železa až o 66 %. V původním pokusu z roku 1983 se jednalo o čaj, který snížil vstřebávání železa z jídla skutečně o 64 procent. U kávy je uváděno snížení o 39 % (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/6402915/\" target=\"_blank\" rel=\"noopener\">Morck et al., 1983</a>).</p>\n      <p>Primárně rozhoduje načasování. Ve stejném pokusu káva vypitá zhruba hodinu před jídlem vstřebávání železa nesnížila vůbec. Problém byl šálek k jídlu nebo těsně po něm.</p>\n\n      <div class=\"pullquote\">Nejde o&nbsp;to, jestli kávu piješ, ale <strong>kdy</strong>. Hodinu před snídaní železo neovlivní. K&nbsp;obědu nebo po&nbsp;něm ano.</div>\n\n      <p>Koho se to reálně týká nejvíc: žen s nižšími zásobami železa, vegetariánek a veganek. Pokud jíš maso a káva ti nesedí zrovna k obědu, zásadní vliv to mít nebude. Praktická rada je jednoduchá: dej si kávu mezi jídly, ne k talíři plnému rostlinného železa.</p>\n\n      <h2 class=\"h2\">Tři rady, které nejspíš můžeš pustit z&nbsp;hlavy</h2>\n\n      <h3 class=\"grp\">1)&nbsp;„Před menstruací tě míň bolí prsa, když vysadíš kávu“</h3>\n      <p>Tahle rada je stará desítky let a v nejlepších datech neobstála. Rozsáhlá prospektivní studie na tisících žen (Nurses' Health Study II) nenašla <strong>žádnou souvislost</strong> kofeinu s premenstruačním syndromem ani s citlivostí prsou (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/27385613/\" target=\"_blank\" rel=\"noopener\">Purdue-Smithe et al., 2016</a>). Podobně dopadly i fibrocystické změny prsou (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/3530165/\" target=\"_blank\" rel=\"noopener\">Levinson a Dunn, 1986</a>).</p>\n\n      <h3 class=\"grp\">2)&nbsp;„Káva škodí, když se snažíš o&nbsp;miminko“</h3>\n      <p>Meta-analýza téměř 27&nbsp;000 účastníků v léčbě neplodnosti nenašla žádnou souvislost běžného příjmu kofeinu s otěhotněním ani s úspěchem umělého oplodnění (<a class=\"internal\" href=\"https://obgyn.onlinelibrary.wiley.com/doi/10.1111/aogs.14464\" target=\"_blank\" rel=\"noopener\">Rao et al., 2022</a>). Ke stejnému závěru došel i starší systematický přehled zaměřený na přirozené početí: žádnou jasnou souvislost mezi kávou a plodností nenašel (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/29276412/\" target=\"_blank\" rel=\"noopener\">Lyngsø et al., 2017</a>). Jiná věc je vyšší příjem kofeinu a diskutovaná souvislost s rizikem potratu v už probíhajícím těhotenství, to je samostatné téma, které řešíme jinde. Na samotnou <em>šanci</em> otěhotnět ale běžná káva podle dat nesahá.</p>\n\n      <h3 class=\"grp\">3)&nbsp;„Káva mi spouští migrénu“</h3>\n      <p>Nejnovější data kofein jako spouštěč migrény nepotvrzují. Studie, které umí líp oddělit skutečnou příčinu od pouhé náhodné souvislosti, žádnou kauzální souvislost kávy se vznikem migrény nenacházejí, a shodly se na tom dvě nezávislé práce (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8822146/\" target=\"_blank\" rel=\"noopener\">Front Genet 2022</a>; <a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/40254465/\" target=\"_blank\" rel=\"noopener\">Neurol Res 2025</a>). Co migrénu naopak opravdu umí spustit, je <strong>náhlé vysazení</strong> kofeinu, takzvaná odvykací bolest hlavy.</p>\n\n      <h2 class=\"h2\">Co si z&nbsp;toho vzít</h2>\n      <p>Tvoje tolerance na kofein není pevně daná, ale mění se s hormony celý život. Při užívání antikoncepce a hlavně v těhotenství ti kofein v těle zůstává mnohem déle, takže opatrnost je na místě. Během cyklu se skoro nic nemění a během menopauzy ho dokonce odbouráš rychleji.</p>\n      <p>Pro tebe optimální množství se tedy nedá jednoduše převzít z internetu ani od kamarádky. Vliv má tvá unikátní biologie, a když jí rozumíš, přestaneš svoje signály přebíjet dalším šálkem ze zvyku. Se svým lékařem pak můžeš najít řešení přesně pro tebe.</p>\n      <p>A pokud sis právě potvrdila, že bys raději zařadila více bezkofeinových alternativ kávy, přehledně jsme se jimi zabývali v článku <a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\" class=\"internal\">Co pít místo kávy</a>.</p>\n\n      <!-- FAQ -->\n      <div class=\"faq\">\n        <h2 class=\"h2\" id=\"faq\">Často kladené otázky</h2>\n        <div class=\"qa\"><p class=\"q\">Proč ženy metabolizují kofein jinak než muži?</p><p class=\"a\">Kofein odbourává hlavně jaterní enzym CYP1A2 a jeho rychlost brzdí estrogen. Protože hladina estrogenu se u žen mění během cyklu, na antikoncepci, v těhotenství i po menopauze, mění se i rychlost, jakou tělo kofein zpracuje. U mužů je hormonální profil stabilnější, takže i metabolismus kofeinu je vyrovnanější.</p></div>\n        <div class=\"qa\"><p class=\"q\">Vydrží kofein v&nbsp;těle déle, když beru hormonální antikoncepci?</p><p class=\"a\">Ano. U žen užívajících kombinovanou hormonální antikoncepci se poločas kofeinu prodlužuje zhruba z 5,4 na 7,9 hodiny, tedy asi o 47 procent (Abernethy a Todd, 1985). Odpolední káva tak může narušit spánek víc, než bys čekala, protože ji máš v těle déle.</p></div>\n        <div class=\"qa\"><p class=\"q\">Mám před menstruací omezit kávu?</p><p class=\"a\">Z hlediska metabolismu kofeinu to nutné není. Rychlost, jakou tělo kofein odbourává, se mezi folikulární a luteální fází cyklu mění tak málo, že to nemá praktický význam (Lane et al., 2000). Rozšířená rada „před menstruací omez kávu“ nemá v datech oporu.</p></div>\n        <div class=\"qa\"><p class=\"q\">Bere káva z&nbsp;těla železo?</p><p class=\"a\">Jen za určitých podmínek. Káva ke jídlu snižuje vstřebávání nehemového (rostlinného) železa, hemové železo z masa skoro neovlivní. Rozhoduje načasování: káva vypitá zhruba hodinu před jídlem vstřebávání železa nesnížila vůbec. Slavné „minus 66 procent“ navíc patří spíš čaji (64 procent), u kávy šlo o 39 procent (Morck et al., 1983).</p></div>\n        <div class=\"qa\"><p class=\"q\">Spouští káva migrénu?</p><p class=\"a\">Podle nejnovějších dat spíše ne. Studie, které umí líp oddělit příčinu od náhodné souvislosti, kofein jako spouštěč migrény nepotvrzují. Co ji naopak umí spustit, je náhlé vysazení kofeinu, tedy takzvaná odvykací bolest hlavy.</p></div>\n        <div class=\"qa\"><p class=\"q\">Proč mi v&nbsp;těhotenství přestala chutnat káva?</p><p class=\"a\">V prvním trimestru prudce stoupají těhotenské hormony (hCG a estrogen) a s nimi se zostřuje čich, takže silné vůně včetně kávy mohou být najednou nepříjemné. Podle studie z roku 2004 kávu v prvním trimestru omezí nebo úplně vysadí až 96 procent žen. Roli nejspíš hraje i to, že kofein je od přírody hořký, a hořkost v nás odjakživa evokuje opatrnost.</p></div>\n      </div>\n\n      <!-- HODNOCENÍ: interaktivní, ukládá vlastní hlas do prohlížeče -->\n      <div class=\"rating\" data-rating=\"\">\n        <p class=\"rating__label\">Ohodnoť článek</p>\n        <div class=\"rating__stars\" role=\"radiogroup\" aria-label=\"Hodnocení článku\">\n          <button type=\"button\" class=\"rating__star\" data-val=\"1\" aria-label=\"1 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"2\" aria-label=\"2 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"3\" aria-label=\"3 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"4\" aria-label=\"4 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"5\" aria-label=\"5 z 5\">★</button>\n        </div>\n        <p class=\"rating__count\" data-rating-msg=\"\">Zatím bez hodnocení. Buď první.</p>\n      </div>\n\n      <!-- O AUTORCE -->\n      <div class=\"authorbox\" id=\"autor\">\n        <span class=\"authorbox__avatar\">LM</span>\n        <p class=\"authorbox__role\">O autorce</p>\n        <p class=\"authorbox__name\">Lucie Mokrá</p>\n        <p class=\"authorbox__bio\">Zakladatelka značky tamoje. Datlovou Pecku vyvinula z touhy dopřát si espresso i filtr kdykoli během dne a přirozeně bez kofeinu. Píše o kávě, kofeinu a životě s ním i bez něj, s oporou v datech a nadšení objevovat nové chutě.</p>\n      </div>\n\n      <!-- RELATED -->\n      <div class=\"related\">\n        <h3>Mohlo by tě zajímat</h3>\n        <ul>\n          <li><a href=\"/blog/kava-v-tehotenstvi-co-rika-veda\">→ Kofein v těhotenství: Co věda opravdu ví a co ještě ne</a></li>\n          <li><a href=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\">→ Bezkofeinová káva není bez kofeinu: celé spektrum a nové odrůdy</a></li>\n          <li><a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\">→ Co pít místo káv
