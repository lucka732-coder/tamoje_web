ře, proč rozhodují geny a co doporučují odborníci.\",\n  \"image\": \"https://tamoje.cz/user/articles/images/kava-tehotenstvi-veda-tamoje.jpg\",\n  \"author\": {\"@type\": \"Person\", \"name\": \"Lucie Mokrá\", \"jobTitle\": \"zakladatelka\", \"worksFor\": {\"@type\": \"Organization\", \"name\": \"tamoje\"}},\n  \"publisher\": {\"@type\": \"Organization\", \"name\": \"tamoje\", \"logo\": {\"@type\": \"ImageObject\", \"url\": \"https://tamoje.cz/user/logos/tamoje-logo.png\"}},\n  \"datePublished\": \"2026-07-09\",\n  \"dateModified\": \"2026-07-09\",\n  \"mainEntityOfPage\": {\"@type\": \"WebPage\", \"@id\": \"https://tamoje.cz/blog/kava-v-tehotenstvi-co-rika-veda\"}\n}\n<\/script>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\"@type\": \"Question\", \"name\": \"Je prokázané, že káva v těhotenství škodí?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Není. Většina dat jsou pozorovací studie, které ukazují souvislost, ne příčinu. Novější metody (mendelovská randomizace, objektivní biomarkery) naznačují, že část dřívějších obav mohla patřit spíš kouření a alkoholu než kávě. Neplyne z toho ale, že je káva prokázaně bezpečná. Věda tu jednotná není.\"}},\n    {\"@type\": \"Question\", \"name\": \"Proč jedna studie říká, že káva vadí, a druhá, že ne?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Protože se liší metodou a protože kofein na každého působí jinak. Rychlost, jakou tělo kofein odbourává, je z velké části daná geny, mezi lidmi je až šedesátinásobný rozdíl. Jedna dávka tak může u dvou žen znamenat něco úplně jiného.\"}},\n    {\"@type\": \"Question\", \"name\": \"Změnily se doporučené limity kofeinu v těhotenství?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Od roku 2015 ne. EFSA i americká ACOG drží hranici do 200 mg kofeinu denně ze všech zdrojů, WHO doporučuje snížit příjem u žen, u kterých je denní příjem kofeinu vyšší než 300 mg. O tom, co je pro tebe to pravé, se poraď se svým lékařem.\"}},\n    {\"@type\": \"Question\", \"name\": \"Proč se v těhotenství doporučuje méně kofeinu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Kofein prochází placentou a plod ho sám neodbourá. V těhotenství se navíc poločas rozpadu kofeinu prodlužuje z běžných 4 až 5 hodin zhruba na 15 hodin ke konci těhotenství, takže se v těle drží déle a hromadí se.\"}},\n    {\"@type\": \"Question\", \"name\": \"Můžu pít kávu v prvním trimestru?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"První trimestr je z hlediska vývoje nejcitlivější období a kofein se v těle drží déle už tady. Oficiální hranice do 200 mg kofeinu denně přitom platí pro celé těhotenství. Někomu navíc v prvních týdnech káva sama přestane chutnat, za to mohou hormonální změny. Kolik je pro tebe v pořádku, probeř se svým lékařem.\"}}\n  ]\n}\n<\/script>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\"@type\": \"ListItem\", \"position\": 1, \"name\": \"tamoje\", \"item\": \"https://tamoje.cz\"},\n    {\"@type\": \"ListItem\", \"position\": 2, \"name\": \"Čtení k jádru věci\", \"item\": \"https://tamoje.cz/blog\"},\n    {\"@type\": \"ListItem\", \"position\": 3, \"name\": \"Káva v těhotenství: co říká věda\"}\n  ]\n}\n<\/script>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ea166cfc-8a19-4ec7-8918-7f7936a38f06\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"730d8f50-fb17-4e36-8d27-848479 KHH1/ZebwY0eX4nw8eYF0bpRYXLljg9PXy/7Z9HsYIYIY2CmtYKCCcTHmv2k+ocrlyMnp52P5HNypWv4d2Wa8YZUrcWSndly5IWP+x5bhNE+obpOTfVbTAhY4RWFy5bMH6bTTMaJrR6R+qs44WNnNDsuXKonBk9Zh/qvr2dpGkbcSRrRI7a6xfCsvo/JJkNhxXSPbC6IvLGmgT7rly2xk5P6MI+uGsZvhjTME6ZMYjlgiS+e3b2WH8P8AiHUc/S45cmcyv/zOHK5ctciX2/8A2Z8f+yJcqVzm7jV+6q8nKkxRDLGG73P2kkXwuXKMfqN8hqvxMroGFzrNd1ahxdiNv/KuXL6/F/RHyeX+8itc47jypInGy3suXLYx+RT6S6kNkk1+i5cgbGwOJa0FEPA8p3A6Llyb9Eitx3uDnUVYw/mC5cmxE07QWiwgnE2R8LlySGRHojGOPC5cqZPyJL+RAhxbKaXLlS8BjpeoTWEnr7LlyoCvzCWzCuOVIHHYuXK14R8kYAI3dDfZP/md9ly5JhEc7t9kHk8x8+65ciI2VhaPMRETjt691y5a/BzfI7aL3d1MCY5mlpINrlyifhri9N7oeXN+HHq7KxhkcS0k2XdbXLl4uT+x6kTSYbGhnACAz5nulDTVLlywj6CEHpqgAiWvMcfppcuUzNIlJrWbPHD6X1u6rzPxXquW2OSpP5Vy5dGEGf/Z\" alt=\"Rozesmátá těhotná žena mezi kamarádkami s dlaněmi na jejím bříšku — kofein v těhotenství\">\n\n      <p><strong>Nechceš přijít o společné sedánky s&nbsp;holkami i&nbsp;když máš na&nbsp;testu dvě čárky?</strong></p>\n      <p>Zadáš do vyhledávače „káva v&nbsp;těhotenství“ a&nbsp;vypadne deset článků a&nbsp;každý říká něco jiného. Přitom nelže ani jeden. Na tom, jestli je káva v&nbsp;těhotenství škodlivá, se totiž neshodne ani věda. Pojď se podívat, co se za posledních pár let opravdu zjistilo a&nbsp;kde se odborníci stále přou.</p>\n\n      <div class=\"tldr\">\n        <h3 class=\"tldr__label\">Zde se dočteš, že:</h3>\n        <ul>\n          <li>Závěry, na kterých by se věda shodla, jsou spíše výjimka. Studie si odporují a většina z nich jen poukazuje na <strong>souvislosti</strong>, ne příčinu.</li>\n          <li>V čem je shoda: v těhotenství se kofein v těle drží <strong>až třikrát déle</strong>. Proto je na místě opatrnost a limit do 200 mg kofeinu denně (podle Evropského úřadu pro bezpečnost potravin, EFSA, a americké společnosti porodníků a gynekologů, ACOG).</li>\n          <li>O tom, kolik kofeinu tělo zvládne, rozhodují i <strong>tvé geny</strong>. Mezi lidmi a jejich schopností vstřebávat kofein je až šedesátinásobný rozdíl. Univerzální bezpečné číslo proto ani nejde jednoduše stanovit.</li>\n          <li>Rozhodnutí tak nepatří titulku ani jedné studii, ale <strong>tobě a tvému lékaři</strong>.</li>\n        </ul>\n      </div>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Než začneš číst</div>\n        <p>Tento článek shrnuje aktuální vědu, má informativní charakter a&nbsp;nenahrazuje radu lékaře. Nedává doporučení, kolik kofeinu si dopřát. O&nbsp;tom, co je pro tebe to pravé, se poraď se svým lékařem nebo gynekologem.</p>\n      </div>\n\n      <h2 class=\"h2\">Proč se články o&nbsp;kávě v&nbsp;těhotenství tak liší</h2>\n      <p>Skoro všechno, co o kávě v těhotenství víme, vychází z <strong>pozorovacích studií</strong>. Ty sledují, co ženy pijí, a porovnají průběh těhotenství. Pokud se objeví nějaká komplikace, umí většinou najít souvislost, ne příčinu. A to je zásadní rozdíl. Když spolu dvě věci souvisí, ještě to neznamená, že se navzájem způsobují.</p>\n      <p>U kávy je ta nejednoznačnost obzvlášť velká, protože káva jde ruku v ruce s dalšími návyky. Data ukazují, že <strong>kdo pije hodně kávy, je statisticky častěji i kuřák nebo pije víc alkoholu</strong>, a od ostatních žen se liší i věkem nebo vzděláním. A právě kouření a alkohol plod prokazatelně poškozují. Studie z roku 2023 místo dotazníku použila objektivní ukazatel z krve. Vazba mezi kofeinem a omezením růstu plodu se pak ztratila, ukázalo se, že za ní stálo kouření (Selvaratnam et al., <em>Int J Epidemiol</em> 2023).</p>\n      <p>V posledních letech se proto vědci zaměřili na chytřejší metody, jako je například <strong>mendelovská randomizace</strong>. Principem je, že se každý rodí s trochu jinou genetickou výbavou a některé geny ovlivňují, jaké má člověk sklony k pití kávy. Genetická výbava je ale náhodná, vzniká již při početí a nezmění ji to, jestli matka kouří nebo pije alkohol. Vědci proto místo nespolehlivého dotazníku „kolik kávy pijete“ sledují tyhle „kávové geny“ jako <strong>nezaujatý ukazatel</strong> spotřeby. Když ženy geneticky laděné k vyšší spotřebě kávy nemají horší výsledky těhotenství, je to silný náznak, že za problémy nestojí káva sama, ale spíš i individuální rozdíly mezi ženami.</p>\n\n      <h2 class=\"h2\">Tři vědecké pohledy na&nbsp;kofein</h2>\n      <p>Projdeš-li studie z posledních let, uvidíš tři různé pohledy, které si navzájem odporují. A jednoznačnou pravdu zatím nemá ani jeden.</p>\n\n      <h3 class=\"grp\">1)&nbsp;Novější studie mění směr</h3>\n      <p>Právě na mendelovské randomizaci stojí dvě velké studie. První (<a class=\"internal\" href=\"https://academic.oup.com/ije/article/52/1/165/6605011\" target=\"_blank\" rel=\"noopener\"><em>Int J Epidemiol</em> 2022</a>) prošla data tisíců těhotných z velkých britských souborů a zkoumala, jestli káva sama zvyšuje riziko nižší porodní hmotnosti, potratu nebo předčasného porodu. Druhá (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11496242/\" target=\"_blank\" rel=\"noopener\">norská studie MoBa, 2024</a>) sledovala desítky tisíc dětí a jejich pozdější vývoj, včetně příznaků ADHD. Ani jedna nenašla přesvědčivý důkaz, že by za problémy stála samotná káva. Jakmile se vzalo v potaz kouření a alkohol, souvislost mezi kofeinem a komplikacemi se výrazně oslabila.</p>\n      <p>Ani tahle metoda ale není neomylná. Část „kávových genů“ se překrývá s kouřením, takže jde o dobrou stopu, ne o konečný závěr.</p>\n      <p>A hlavně: neznamená to, že je káva bezpečná. Znamená to jen, že část dřívějších obav nejspíš patřila něčemu jinému než kávě. Neprokázat škodlivost totiž není totéž co prokázat bezpečnost.</p>\n\n      <h3 class=\"grp\">2)&nbsp;Žádná jistě bezpečná hranice není</h3>\n      <p>Zastánci opatrnosti se opírají o data, v kterých se rizika objevují i při příjmu malého množství kofeinu. Jejich logika je prostá: protože kofein prochází placentou a v těhotenství se v těle drží déle, i malá dávka se počítá. Takže podle nich žádná hranice „bezpečného“ množství kofeinu neexistuje. Rozsáhlý přehled 48 studií (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/32843532/\" target=\"_blank\" rel=\"noopener\">BMJ Evidence-Based Medicine, 2020 a 2021</a>) zároveň nenašel žádnou hranici, pod kterou by souvislost mezi kofeinem a horšími průběhy těhotenství mizela. Jeho autor proto doporučuje kofein v těhotenství vynechat úplně. Odvolává se třeba na analýzu, která spojila nižší porodní hmotnost už s příjmem kolem 50 mg denně, tedy s půl šálkem kávy (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/33764424/\" target=\"_blank\" rel=\"noopener\">NICHD, 2021</a>).</p>\n      <p>Je to lehce sporný postoj, postavený opět na pozorovacích datech, která příčinu prokázat neumí. Přehlédnout se ale nedá, vychází z recenzovaného zdroje a bere vážně i nejmenší dávky.</p>\n\n      <h3 class=\"grp\">3)&nbsp;Zatím největší studie riziko nenašla, ale…</h3>\n      <p>Nejnovější a zatím jedna z největších studií na tohle téma sledovala přes 7&nbsp;000 prvorodiček (<a class=\"internal\" href=\"https://obgyn.onlinelibrary.wiley.com/doi/10.1111/1471-0528.70018\" target=\"_blank\" rel=\"noopener\">BJOG, 2026</a>) a zaměřila se výhradně na období kolem početí. Ani u vyššího příjmu kofeinu nenašla souvislost s horším průběhem těhotenství a komplikacemi, jako je předčasný porod nebo omezený růst plodu.</p>\n      <p>Má to ale háček. Závěry stojí na dotaznících, kde ženy samy uváděly, kolik kofeinu vypily, nikoliv na rozboru krve. A protože studie mapuje jen období kolem početí a zbytek těhotenství ani pozdější vývoj dítěte nesleduje, vzácnější komplikace, které se projeví později, spolehlivě zachytit nedokáže. Sami autoři proto uzavírají, že jsou potřeba přesnější měření kofeinu a dlouhodobé sledování dětí.</p>\n\n      <div class=\"pullquote\">Tři pohledy, tři metody, tři závěry. Každý je jiný a&nbsp;právě proto ti nikdo nedá striktní závěry se stoprocentní jistotou.</div>\n\n      <h2 class=\"h2\">Proč stejná káva působí na&nbsp;každou ženu jinak</h2>\n      <p>Kus té neshody má na svědomí biologie. <strong>Rychlost, jakou tělo kofein odbourává, je z velké části daná geny.</strong> V té rychlosti se lidé liší až šedesátinásobně (<a class=\"internal\" href=\"https://link.springer.com/article/10.1186/s12967-024-05737-z\" target=\"_blank\" rel=\"noopener\">Journal of Translational Medicine, 2024</a>). Stejný šálek tak u jedné ženy zmizí za pár hodin a u jiné se drží skoro celý den.</p>\n      <p>Co to znamená pro těhotenství, ale zatím jasné není. Jedna japonská studie naznačila, že roli hraje kombinace genů a dávky, šlo ale o malou skupinu a výsledek se nepodařilo zopakovat. Jiná, větší studie (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/33764424/\" target=\"_blank\" rel=\"noopener\">NICHD, 2021</a>) naopak žádný rozdíl podle genů nenašla. Takže i tady platí: zajímavá stopa, ne hotová pravda. Rozhodně to není návod „mám ty správné geny, tak si můžu dovolit víc“.</p>\n\n      <h2 class=\"h2\">Jedna věc, na&nbsp;které se studie shodnou: v&nbsp;těhotenství se kofein drží déle</h2>\n      <p>V čem panuje shoda, je farmakologie. Kofein prochází placentou a plod ho sám neodbourá. A tělo matky ho odbourává čím dál pomaleji: <strong>poločas rozpadu se prodlužuje z běžných 4 až 5 hodin zhruba na 15 hodin</strong> ke konci těhotenství, tedy asi třikrát déle (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12526311/\" target=\"_blank\" rel=\"noopener\">přehledová studie, Nutrients 2025</a>). Kofein se tak v těle drží a hromadí.</p>\n      <p>Autoři téhle review z toho vyvodili návrh: možná by v těhotenství dávalo větší smysl řídit se ne denní dávkou, ale odstupem, třeba nanejvýš jedním nápojem s kofeinem za 24 až 36 hodin. Je to <strong>návrh jedné vědecké práce, ne oficiální doporučení.</strong> EFSA, ACOG ani Světová zdravotnická organizace (WHO) ho nepřevzaly.</p>\n\n      <h2 class=\"h2\">Kolik kofeinu v&nbsp;těhotenství je oficiálně bezpečné</h2>\n      <p>Zatímco se věda pře, oficiální limity se od roku 2015 nezměnily a úplně jednotné taky nejsou:</p>\n      <ul>\n        <li><strong>EFSA</strong> a <strong>ACOG</strong>: do <strong>200 mg</strong> kofeinu denně ze všech zdrojů.</li>\n        <li><strong>WHO</strong>: doporučuje snížit příjem u žen, které mají příjem kofeinu nad <strong>300 mg</strong> denně.</li>\n      </ul>\n      <p>Pro představu, 200 mg jsou zhruba dva šálky filtrované kávy, ale kofein je i v čaji, kole a čokoládě a všechno se počítá dohromady. Kolik kofeinu mají jednotlivé alternativy, rozebíráme v článku <a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\" class=\"internal\">Co pít místo kávy</a>.</p>\n\n      <h2 class=\"h2\">Co si z&nbsp;toho vzít</h2>\n      <p>Poctivá odpověď zní: <strong>jistota neexistuje a nejspíš chvíli nebude.</strong> Jedna část studií riziko nenachází, druhá před nimi přímo varuje, a nově do tématu vstupuje také biologie každého z nás. Rozhodnutí by tedy nemělo podléhat titulku ani jedné ze studií, ale tobě a tvému lékaři.</p>\n      <p>Pokud jsi rozhodnutá pro změnu, máš dvě možnosti. Můžeš svůj příjem kofeinu hlídat a držet se pod doporučenou hranicí 200 mg, nebo kofein vynechat úplně a sáhnout po nápojích, které ho nemají. Novinkou mezi přirozeně bezkofeinovými nápoji je například <a href=\"/\" class=\"internal\">Datlová Pecka</a>. Pražený nápoj s originální recepturou z datlových pecek a pečlivě vybrané směsi rostlin pro přípravu espressa i filtru. Obě cesty jsou legitimní. Důležité ale je mít jasno v tom, co dělá dobře právě tobě. Jen tak budeš mít radost z volby.</p>\n\n      <!-- FAQ -->\n      <div class=\"faq\">\n        <h2 class=\"h2\" id=\"faq\">Často kladené otázky</h2>\n        <div class=\"qa\"><p class=\"q\">Je prokázané, že káva v&nbsp;těhotenství škodí?</p><p class=\"a\">Není. Většina dat jsou pozorovací studie, které ukazují souvislost, ne příčinu. Novější metody (mendelovská randomizace, objektivní biomarkery) naznačují, že část dřívějších obav mohla patřit spíš kouření a alkoholu než kávě. Neplyne z toho ale, že je káva prokázaně bezpečná. Věda tu jednotná není.</p></div>\n        <div class=\"qa\"><p class=\"q\">Proč jedna studie říká, že káva vadí, a&nbsp;druhá, že ne?</p><p class=\"a\">Protože se liší metodou a protože kofein na každého působí jinak. Rychlost, jakou tělo kofein odbourává, je z velké části daná geny, mezi lidmi je až šedesátinásobný rozdíl. Jedna dávka tak může u dvou žen znamenat něco úplně jiného.</p></div>\n        <div class=\"qa\"><p class=\"q\">Změnily se doporučené limity kofeinu v&nbsp;těhotenství?</p><p class=\"a\">Od roku 2015 ne. EFSA i americká ACOG drží hranici do 200 mg kofeinu denně ze všech zdrojů, WHO doporučuje snížit příjem u žen, u kterých je denní příjem kofeinu vyšší než 300 mg. O tom, co je pro tebe to pravé, se poraď se svým lékařem.</p></div>\n        <div class=\"qa\"><p class=\"q\">Proč se v&nbsp;těhotenství doporučuje méně kofeinu?</p><p class=\"a\">Kofein prochází placentou a plod ho sám neodbourá. V těhotenství se navíc poločas rozpadu kofeinu prodlužuje z běžných 4 až 5 hodin zhruba na 15 hodin ke konci těhotenství, takže se v těle drží déle a hromadí se.</p></div>\n        <div class=\"qa\"><p class=\"q\">Můžu pít kávu v&nbsp;prvním trimestru?</p><p class=\"a\">První trimestr je z hlediska vývoje nejcitlivější období a kofein se v těle drží déle už tady. Oficiální hranice do 200 mg kofeinu denně přitom platí pro celé těhotenství. Někomu navíc v prvních týdnech káva sama přestane chutnat, za to mohou hormonální změny. Kolik je pro tebe v pořádku, probeř se svým lékařem.</p></div>\n      </div>\n\n      <!-- HODNOCENÍ: interaktivní, ukládá vlastní hlas do prohlížeče -->\n      <div class=\"rating\" data-rating=\"\">\n        <p class=\"rating__label\">Ohodnoť článek</p>\n        <div class=\"rating__stars\" role=\"radiogroup\" aria-label=\"Hodnocení článku\">\n          <button type=\"button\" class=\"rating__star\" data-val=\"1\" aria-label=\"1 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"2\" aria-label=\"2 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"3\" aria-label=\"3 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"4\" aria-label=\"4 z 5\">★</button>\n          <button type=\"button\" class=\"rating__star\" data-val=\"5\" aria-label=\"5 z 5\">★</button>\n        </div>\n        <p class=\"rating__count\" data-rating-msg=\"\">Zatím bez hodnocení. Buď první.</p>\n      </div>\n\n      <!-- O AUTORCE -->\n      <div class=\"authorbox\" id=\"autor\">\n        <span class=\"authorbox__avatar\">LM</span>\n        <p class=\"authorbox__role\">O autorce</p>\n        <p class=\"authorbox__name\">Lucie Mokrá</p>\n        <p class=\"authorbox__bio\">Zakladatelka značky tamoje. Datlovou Pecku vyvinula z touhy dopřát si espresso i filtr kdykoli během dne a přirozeně bez kofeinu. Píše o kávě, kofeinu a životě s ním i bez něj, s oporou v datech a nadšení objevovat nové chutě.</p>\n      </div>\n\n      <!-- RELATED -->\n      <div class=\"related\">\n        <h3>Mohlo by tě zajímat</h3>\n        <ul>\n          <li><a href=\"https://tamoje.cz/blog/kofein-a-hormony\">→ Kofein a hormony: proč na tebe působí káva jinak</a></li>\n          <li><a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\">→ Co pít místo kávy: 12 alternativ a jak vybrat</a></li>\n          <li><a href=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\">→ Bezkofeinová káva není bez kofeinu: celé spektrum a nové odrůdy</a></li>\n        </ul>\n        <div class=\"related__all\"><a class=\"related__btn\" href=\"/blog\">Čtení k jádru věci: všechny články <span aria-hidden=\"true\">→</span></a></div>\n      </div>\n\n      <!-- ZDROJE -->\n      <div class=\"sources\">\n        <h3>Zdroje</h3>\n        <p>Brito Nunes et al., <em>Int J Epidemiol</em> 2022 (<a href=\"https://academic.oup.com/ije/article/52/1/165/6605011\" target=\"_blank\" rel=\"noopener\">→</a>
