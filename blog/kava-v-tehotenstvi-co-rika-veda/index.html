"<!DOCTYPE html>\n<html lang=\"cs\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n\n\n<!-- ===== SEO META ===== -->\n<title>Kofein v těhotenství: Co věda opravdu ví a co ještě ne | tamoje<\u002Ftitle>\n<meta name=\"description\" content=\"Škodí káva v těhotenství? Nejnovější studie se liší. Kde se věda pře, proč rozhodují geny a co doporučují odborníci.\">\n<meta name=\"keywords\" content=\"káva v těhotenství, kofein v těhotenství věda, škodí káva v těhotenství, kofein v těhotenství studie, kolik kofeinu v těhotenství\">\n<link rel=\"canonical\" href=\"https://tamoje.cz/blog/kava-v-tehotenstvi-co-rika-veda\">\n\n<meta property=\"og:title\" content=\"Kofein v těhotenství: Co věda opravdu ví a co ještě ne | tamoje\">\n<meta property=\"og:description\" content=\"Škodí káva v těhotenství? Nejnovější studie se liší. Kde se věda pře, proč rozhodují geny a co doporučují odborníci.\">\n<meta property=\"og:type\" content=\"article\">\n<meta property=\"og:url\" content=\"https://tamoje.cz/blog/kava-v-tehotenstvi-co-rika-veda\">\n<meta property=\"og:image\" content=\"https://tamoje.cz/user/articles/images/kava-tehotenstvi-veda-tamoje.jpg\">\n<meta property=\"og:image:alt\" content=\"Šálek na stole vedle otevřených vědeckých studií\">\n<meta property=\"og:site_name\" content=\"tamoje\">\n<meta property=\"og:locale\" content=\"cs_CZ\">\n<meta property=\"article:published_time\" content=\"2026-07-09\">\n<meta property=\"article:modified_time\" content=\"2026-07-09\">\n<meta property=\"article:author\" content=\"Lucie Mokrá\">\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large, max-snippet:-1\">\n\n<!-- ===== SCHEMA ===== -->\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"Article\",\n  \"headline\": \"Kofein v těhotenství: Co už věda opravdu ví a co ještě ne?\",\n  \"description\": \"Škodí káva v těhotenství? Nejnovější studie se liší. Kde se věda pře, proč rozhodují geny a co doporučují odborníci.\",\n  \"image\": \"https://tamoje.cz/user/articles/images/kava-tehotenstvi-veda-tamoje.jpg\",\n  \"author\": {\"@type\": \"Person\", \"name\": \"Lucie Mokrá\", \"jobTitle\": \"zakladatelka\", \"worksFor\": {\"@type\": \"Organization\", \"name\": \"tamoje\"}},\n  \"publisher\": {\"@type\": \"Organization\", \"name\": \"tamoje\", \"logo\": {\"@type\": \"ImageObject\", \"url\": \"https://tamoje.cz/user/logos/tamoje-logo.png\"}},\n  \"datePublished\": \"2026-07-09\",\n  \"dateModified\": \"2026-07-09\",\n  \"mainEntityOfPage\": {\"@type\": \"WebPage\", \"@id\": \"https://tamoje.cz/blog/kava-v-tehotenstvi-co-rika-veda\"}\n}\n<\u002Fscript>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\"@type\": \"Question\", \"name\": \"Je prokázané, že káva v těhotenství škodí?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Není. Většina dat jsou pozorovací studie, které ukazují souvislost, ne příčinu. Novější metody (mendelovská randomizace, objektivní biomarkery) naznačují, že část dřívějších obav mohla patřit spíš kouření a alkoholu než kávě. Neplyne z toho ale, že je káva prokázaně bezpečná. Věda tu jednotná není.\"}},\n    {\"@type\": \"Question\", \"name\": \"Proč jedna studie říká, že káva vadí, a druhá, že ne?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Protože se liší metodou a protože kofein na každého působí jinak. Rychlost, jakou tělo kofein odbourává, je z velké části daná geny, mezi lidmi je až šedesátinásobný rozdíl. Jedna dávka tak může u dvou žen znamenat něco úplně jiného.\"}},\n    {\"@type\": \"Question\", \"name\": \"Změnily se doporučené limity kofeinu v těhotenství?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Od roku 2015 ne. EFSA i americká ACOG drží hranici do 200 mg kofeinu denně ze všech zdrojů, WHO doporučuje snížit příjem u žen, u kterých je denní příjem kofeinu vyšší než 300 mg. O tom, co je pro tebe to pravé, se poraď se svým lékařem.\"}},\n    {\"@type\": \"Question\", \"name\": \"Proč se v těhotenství doporučuje méně kofeinu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Kofein prochází placentou a plod ho sám neodbourá. V těhotenství se navíc poločas rozpadu kofeinu prodlužuje z běžných 4 až 5 hodin zhruba na 15 hodin ke konci těhotenství, takže se v těle drží déle a hromadí se.\"}},\n    {\"@type\": \"Question\", \"name\": \"Můžu pít kávu v prvním trimestru?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"První trimestr je z hlediska vývoje nejcitlivější období a kofein se v těle drží déle už tady. Oficiální hranice do 200 mg kofeinu denně přitom platí pro celé těhotenství. Někomu navíc v prvních týdnech káva sama přestane chutnat, za to mohou hormonální změny. Kolik je pro tebe v pořádku, probeř se svým lékařem.\"}}\n  ]\n}\n<\u002Fscript>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\"@type\": \"ListItem\", \"position\": 1, \"name\": \"tamoje\", \"item\": \"https://tamoje.cz\"},\n    {\"@type\": \"ListItem\", \"position\": 2, \"name\": \"Čtení k jádru věci\", \"item\": \"https://tamoje.cz/blog\"},\n    {\"@type\": \"ListItem\", \"position\": 3, \"name\": \"Káva v těhotenství: co říká věda\"}\n  ]\n}\n<\u002Fscript>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ea166cfc-8a19-4ec7-8918-7f7936a38f06\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"730d8f50-fb17 -- */\n.mbtn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;\n  font-size:.92rem;font-weight:700;letter-spacing:.04em;border:1.5px solid transparent;\n  transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}\n.mbtn:active{transform:translateY(1px)}\n.mbtn--rasp{background:var(--rasp);color:#fff;border-color:var(--rasp)}\n.mbtn--ink{background:var(--ink);color:#fff;border-color:var(--ink)}\n.mbtn--outl{background:transparent;color:#fff;border-color:#fff}\n.mbtn--outd{background:transparent;color:var(--ink);border-color:var(--ink)}\n@media(hover:hover){\n  .mbtn--rasp:hover{background:var(--rasp-hi);border-color:var(--rasp-hi)}\n  .mbtn--ink:hover{background:#5a1233;border-color:#5a1233}\n  .mbtn--outl:hover{color:var(--rasp-hi);border-color:var(--rasp-hi)}\n  .mbtn--outd:hover{color:var(--rasp);border-color:var(--rasp)}\n}\n\n/* ---- Footer ---- */\n.mfoot{background:var(--plum);color:var(--white);padding:44px var(--pad)}\n.mfoot__inner{max-width:1040px;margin:0 auto}\n.mfoot .brand{display:block;margin-bottom:18px;font-size:1.4rem;font-weight:700;color:var(--white);text-transform:lowercase}\n.mfoot ul{list-style:none;display:flex;flex-wrap:wrap;gap:12px 26px;margin:0 0 22px;padding:0}\n.mfoot a{font-size:.9rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85);transition:color .2s var(--ease)}\n.mfoot a:hover{color:var(--rasp)}\n.mfoot .copy{font-size:.8rem;opacity:.6}\n<\u002Fstyle>\n<style>\n  /* Článek — staví na tamoje-blog.css (produkční systém) */\n  :root{--camel-300:#EEBB63;--camel-400:#E8A33D;--camel-500:#C9861F;--camel-600:#A66B12}\n  .a-hero{position:relative;background-image:url(\"3613d940-c82c-48e3-8059-ce5100cddb47\");background-color:#4a0d2e;background-position:center;background-size:cover;padding:0;min-height:clamp(220px,30vw,360px)}\n  .a-hero::before{display:none}\n\n  .body-sec{background:var(--plu n  .byline__avatar{width:40px;height:40px;border-radius:50%;background:var(--plum);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;flex:none}\n  .byline__who{display:flex;flex-direction:column;line-height:1.25;margin-right:4px}\n  .byline__name{font-weight:800;color:var(--plum)}\n  a.byline__namelink{text-decoration:none;border-bottom:none}\n  a.byline__namelink:hover{color:var(--rasp)}\n  .byline__org{font-size:.78rem;font-weight:600;color:#8a7079}\n  .byline__item{display:inline-flex;align-items:center;gap:7px}\n  .byline__item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}\n  .a-divider{border:none;border-top:1px solid rgba(64,0,23,.14);margin:22px 0 32px}\n\n  .tldr{margin:30px 0 38px}\n  .tldr__label{font-size:1.4rem;font-weight:800;color:var(--plum);margin:0 0 14px;line-height:1.2}\n  .tldr ul{margin:4px 0 0 20px;padding:0;list-style:disc}\n  .tldr li{margin-bottom:9px;font-size:1.04rem;line-height:1.66;color:var(--ink)}\n  .tldr li:last-child{margin-bottom:0}\n\n  /* Vědecké pohledy (camp) — v jazyce šablony */\n  .camp{background:var(--cream-2);border:1px solid rgba(64,0,23,.1);border-left:3px solid var(--rasp);padding:26px 30px;margin:30px 0}\n  .camp__label{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);margin:0 0 10px}\n  .camp h3{font-size:1.3rem;font-weight:800;color:var(--plum);margin:0 0 12px;line-height:1.2}\n  .camp p{font-size:1rem;line-height:1.7;margin:0 0 14px;color:var(--ink)}\n  .camp p:last-child{margin-bottom:0}\n\n  /* Disclaimer / data callout */\n  .callout{background:var(--plum);border:none;padding:26px 30px;margin:32px 0}\n  .callout .lbl{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:10px}\n  .callout p{font-size:1rem;line-height:1.65;margin:0;color:var(--cream-2)}\n  .callout strong{color:#fff}\n\n  .pullquote{background:var(--plum);color:var(--cream-2);padding:36px 34px;margin:44px 0;\n    font-size:1.5rem;font-weight:400;line-height:1.4;letter-spacing:-.01em}\n  .pullquote strong{color:#fff;font-weight:800}\n\n  .authorbox{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px 20px;align-items:start;margin-top:40px;padding-top:30px;border-top:1px solid rgba(64,0,23,.14);scroll-margin-top:78px}\n  .authorbox__avatar{grid-row:1 / span 2;align-self:center;width:56px;height:56px;border-radius:50%;background:var(--plum);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:1rem}\n  .authorbox__role{grid-column:2;white-space:nowrap;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a89aa0;margin:0 0 4px;align-self:end}\n  .authorbox__name{grid-column:2;white-space:nowrap;font-weight:800;color:var(--plum);margin:0;font-size:1.1rem;align-self:start}\n  .authorbox__bio{grid-column:3;grid-row:1 / span 2;font-size:.82rem;line-height:1.7;color:#8a7079;margin:0;align-self:center}\n  @media(max-width:560px){.authorbox{grid-template-columns:auto 1fr}.authorbox__bio{grid-column:1 / -1;grid-row:auto;margin-top:12px}}\n\n  .faq{margin-top:52px}\n  .faq .qa{border-top:1px solid rgba(64,0,23,.14);padding:20px 0}\n  .faq .q{font-size:1.08rem;font-weight:800;color:var(--plum);margin:0 0 8px}\n  .faq .a{font-size:.98rem;line-height:1.6;margin:0;color:var(--ink)}\n\n  .sources{margin-top:36px;border-top:1px solid rgba(64,0,23,.14);padding-top:22px}\n  .sources h3{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);margin:0 0 12px}\n  .sources p{margin:0;font-size:.82rem;color:#8a7079;line-height:1.8}\n  .sources a{color:#8a7079;font-weight:400}\n\n  /* Hodnocení */\n  .rating{margin-top:44px;border-top:1px solid rgba(64,0,23,.14);padding-top:26px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px}\n  .rating__label{font-size:1rem;font-weight:800;color:var(--plum);margin:0}\n  .rating__stars{display:inline-flex;gap:4px}\n  .rating__star{font-size:1.5rem;line-height:1;color:#d9cdd3;background:none;border:none;padding:0 1px;cursor:pointer;transition:color .12s var(--ease),transform .12s var(--ease)}\n  .rating__star:hover{transform:scale(1.12)}\n  .rating__star.on{color:var(--camel-400)}\n  .rating__count{font-size:.86rem;color:#8a7079;margin:0}\n\n  .related{margin-top:36px;border-top:1px solid rgba(64,0,23,.14);padding-top:28px}\n  .related h3{font-size:1.15rem;font-weight:800;color:var(--plum);margin:0 0 14px}\n  .related ul{list-style:none;margin:0;padding:0}\n  .related li{margin-bottom:11px}\n  .related a{color:var(--rasp);font-weight:700}\n  .related a:hover{color:var(--rasp-hi)}\n  .related__all{margin-top:26px;padding-top:26px;border-top:1px solid rgba(64,0,23,.14)}\n  .related a.related__btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border:1.5px solid var(--rasp);\n    background:var(--rasp);color:#fff;font-size:.92rem;font-weight:700;letter-spacing:.02em;\n    transition:background-color .2s var(--ease),border-color .2s var(--ease)}\n  .related a.related__btn:hover{background:var(--rasp-hi);border-color:var(--rasp-hi);color:#fff}\n\n  .afoot{margin-top:36px;border-top:1px solid rgba(64,0,23,.14);padding-top:22px;font-size:.82rem;color:#8a7079;line-height:1.9}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <template id=\"__bundler_thumbnail\" data-bg-color=\"#400024\">\n    <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n      <rect width=\"1200\" height=\"800\" fill=\"#400024\"><\u002Frect>\n      <circle cx=\"600\" cy=\"330\" r=\"150\" fill=\"none\" stroke=\"#DC3855\" stroke-width=\"26\"><\u002Fcircle>\n      <path d=\"M600 250 v80 l55 40\" fill=\"none\" stroke=\"#E5DFD7\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <text x=\"600\" y=\"560\" font-family=\"Mulish, sans-serif\" font-size=\"86\" font-weight=\"800\" fill=\"#E5DFD7\" text-anchor=\"middle\">tamoje<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Ftemplate>\n\n  <!-- ===== Header ===== -->\n  <header class=\"mhead\">\n    <div class=\"mhead__bar\">\n      <a class=\"brand\" href=\"/\">tamoje<\u002Fa>\n      <ul class=\"mnav-links\">\n        <li><a href=\"/tamoje-pribeh_pecky.html\">Příběh<\u002Fa><\u002Fli>\n        <li><a href=\"/blog\" aria-current=\"page\">Články<\u002Fa><\u002Fli>\n        <li><a href=\"/tamoje-kontakt.html\">Kontakt<\u002Fa><\u002Fli>\n      <\u002Ful>\n      <a class=\"mnavcta\" href=\"https://shop.tamoje.cz/eshop/\">E-shop<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===== Hero ===== -->\n  <section class=\"msec msec--photo a-hero\" data-screen-label=\"Článek — hero\"><\u002Fsection>\n\n  <!-- ===== Tělo článku ===== -->\n  <section class=\"msec body-sec\">\n    <article class=\"article-body\" data-screen-label=\"Článek — tělo\">\n\n      <nav class=\"crumb card-crumb\" aria-label=\"breadcrumb\">\n        <a href=\"/\">tamoje<\u002Fa> › <a href=\"/blog\">Čtení k jádru věci<\u002Fa> › Káva v těhotenství: co říká věda\n      <\u002Fnav>\n\n      <h1 class=\"a-title\">Kofein v&nbsp;těhotenství<\u002Fh1>\n      <h2 class=\"a-subtitle\">Co už věda opravdu ví a&nbsp;co ještě ne?<\u002Fh2>\n\n      <div class=\"byline\">\n        <span class=\"byline__avatar\">LM<\u002Fspan>\n        <span class=\"byline__who\"><a class=\"byline__name byline__namelink\" href=\"#autor\">Lucie Mokrá →<\u002Fa><span class=\"byline__org\">zakladatelka tamoje<\u002Fspan><\u002Fspan>\n        <span class=\"byline__item\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg><time datetime=\"2026-07-09\">9. 7. 2026<\u002Ftime><\u002Fspan>\n        <span class=\"byline__item\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>10 min čtení<\u002Fspan>\n      <\u002Fdiv>\n      <hr class=\"a-divider\">\n\n      <p><strong>Nechceš přijít o společné sedánky s&nbsp;holkami i&nbsp;když máš na&nbsp;testu dvě čárky?<\u002Fstrong><\u002Fp>\n      <p>Zadáš do vyhledávače „káva v&nbsp;těhotenství“ a&nbsp;vypadne deset článků a&nbsp;každý říká něco jiného. Přitom nelže ani jeden. Na tom, jestli je káva v&nbsp;těhotenství škodlivá, se totiž neshodne ani věda. Pojď se podívat, co se za posledních pár let opravdu zjistilo a&nbsp;kde se odborníci stále přou.<\u002Fp>\n\n      <div class=\"tldr\">\n        <h3 class=\"tldr__label\">Zde se dočteš, že:<\u002Fh3>\n        <ul>\n          <li>Závěry, na kterých by se věda shodla, jsou spíše výjimka. Studie si odporují a většina z nich jen poukazuje na <strong>souvislosti<\u002Fstrong>, ne příčinu.<\u002Fli>\n          <li>V čem je shoda: v těhotenství se kofein v těle drží <strong>až třikrát déle<\u002Fstrong>. Proto je na místě opatrnost a limit do 200 mg kofeinu denně (podle Evropského úřadu pro bezpečnost potravin, EFSA, a americké společnosti porodníků a gynekologů, ACOG).<\u002Fli>\n          <li>O tom, kolik kofeinu tělo zvládne, rozhodují i <strong>tvé geny<\u002Fstrong>. Mezi lidmi a jejich schopností vstřebávat kofein je až šedesátinásobný rozdíl. Univerzální bezpečné číslo proto ani nejde jednoduše stanovit.<\u002Fli>\n          <li>Rozhodnutí tak nepatří titulku ani jedné studii, ale <strong>tobě a tvému lékaři<\u002Fstrong>.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Než začneš číst<\u002Fdiv>\n        <p>Tento článek shrnuje aktuální vědu, má informativní charakter a&nbsp;nenahrazuje radu lékaře. Nedává doporučení, kolik kofeinu si dopřát. O&nbsp;tom, co je pro tebe to pravé, se poraď se svým lékařem nebo gynekologem.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 class=\"h2\">Proč se články o&nbsp;kávě v&nbsp;těhotenství tak liší<\u002Fh2>\n      <p>Skoro všechno, co o kávě v těhotenství víme, vychází z <strong>pozorovacích studií<\u002Fstrong>. Ty sledují, co ženy pijí, a porovnají průběh těhotenství. Pokud se objeví nějaká komplikace, umí většinou najít souvislost, ne příčinu. A to je zásadní rozdíl. Když spolu dvě věci souvisí, ještě to neznamená, že se navzájem způsobují.<\u002Fp>\n      <p>U kávy je ta nejednoznačnost obzvlášť velká, protože káva jde ruku v ruce s dalšími návyky. Data ukazují, že <strong>kdo pije hodně kávy, je statisticky častěji i kuřák nebo pije víc alkoholu<\u002Fstrong>, a od ostatních žen se liší i věkem nebo vzděláním. A právě kouření a alkohol plod prokazatelně poškozují. Studie z roku 2023 místo dotazníku použila objektivní ukazatel z krve. Vazba mezi kofeinem a omezením růstu plodu se pak ztratila, ukázalo se, že za ní stálo kouření (Selvaratnam et al., <em>Int J Epidemiol<\u002Fem> 2023).<\u002Fp>\n      <p>V posledních letech se proto vědci zaměřili na chytřejší metody, jako je například <strong>mendelovská randomizace<\u002Fstrong>. Principem je, že se každý rodí s trochu jinou genetickou výbavou a některé geny ovlivňují, jaké má člověk sklony k pití kávy. Genetická výbava je ale náhodná, vzniká již při početí a nezmění ji to, jestli matka kouří nebo pije alkohol. Vědci proto místo nespolehlivého dotazníku „kolik kávy pijete“ sledují tyhle „kávové geny“ jako <strong>nezaujatý ukazatel<\u002Fstrong> spotřeby. Když ženy geneticky laděné k vyšší spotřebě kávy nemají horší výsledky těhotenství, je to silný náznak, že za problémy nestojí káva sama, ale spíš i individuální rozdíly mezi ženami.<\u002Fp>\n\n      <h2 class=\"h2\">Tři vědecké pohledy na&nbsp;kofein<\u002Fh2>\n      <p>Projdeš-li studie z posledních let, uvidíš tři různé pohledy, které si navzájem odporují. A jednoznačnou pravdu zatím nemá ani jeden.<\u002Fp>\n\n      <h3 class=\"grp\">1)&nbsp;Novější studie mění směr<\u002Fh3>\n      <p>Právě na mendelovské randomizaci stojí dvě velké studie. První (<a class=\"internal\" href=\"https://academic.oup.com/ije/article/52/1/165/6605011\" target=\"_blank\" rel=\"noopener\"><em>Int J Epidemiol<\u002Fem> 2022<\u002Fa>) prošla data tisíců těhotných z velkých britských souborů a zkoumala, jestli káva sama zvyšuje riziko nižší porodní hmotnosti, potratu nebo předčasného porodu. Druhá (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11496242/\" target=\"_blank\" rel=\"noopener\">norská studie MoBa, 2024<\u002Fa>) sledovala desítky tisíc dětí a jejich pozdější vývoj, včetně příznaků ADHD. Ani jedna nenašla přesvědčivý důkaz, že by za problémy stála samotná káva. Jakmile se vzalo v potaz kouření a alkohol, souvislost mezi kofeinem a komplikacemi se výrazně oslabila.<\u002Fp>\n      <p>Ani tahle metoda ale není neomylná. Část „kávových genů“ se překrývá s kouřením, takže jde o dobrou stopu, ne o konečný závěr.<\u002Fp>\n      <p>A hlavně: neznamená to, že je káva bezpečná. Znamená to jen, že část dřívějších obav nejspíš patřila něčemu jinému než kávě. Neprokázat škodlivost totiž není totéž co prokázat bezpečnost.<\u002Fp>\n\n      <h3 class=\"grp\">2)&nbsp;Žádná jistě bezpečná hranice není<\u002Fh3>\n      <p>Zastánci opatrnosti se opírají o data, v kterých se rizika objevují i při příjmu malého množství kofeinu. Jejich logika je prostá: protože kofein prochází placentou a v těhotenství se v těle drží déle, i malá dávka se počítá. Takže podle nich žádná hranice „bezpečného“ množství kofeinu neexistuje. Rozsáhlý přehled 48 studií (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/32843532/\" target=\"_blank\" rel=\"noopener\">BMJ Evidence-Based Medicine, 2020 a 2021<\u002Fa>) zároveň nenašel žádnou hranici, pod kterou by souvislost mezi kofeinem a horšími průběhy těhotenství mizela. Jeho autor proto doporučuje kofein v těhotenství vynechat úplně. Odvolává se třeba na analýzu, která spojila nižší porodní hmotnost už s příjmem kolem 50 mg denně, tedy s půl šálkem kávy (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/33764424/\" target=\"_blank\" rel=\"noopener\">NICHD, 2021<\u002Fa>).<\u002Fp>\n      <p>Je to lehce sporný postoj, postavený opět na pozorovacích datech, která příčinu prokázat neumí. Přehlédnout se ale nedá, vychází z recenzovaného zdroje a bere vážně i nejmenší dávky.<\u002Fp>\n\n      <h3 class=\"grp\">3)&nbsp;Zatím největší studie riziko nenašla, ale…<\u002Fh3>\n      <p>Nejnovější a zatím jedna z největších studií na tohle téma sledovala přes 7&nbsp;000 prvorodiček (<a class=\"internal\" href=\"https://obgyn.onlinelibrary.wiley.com/doi/10.1111/1471-0528.70018\" target=\"_blank\" rel=\"noopener\">BJOG, 2026<\u002Fa>) a zaměřila se výhradně na období kolem početí. Ani u vyššího příjmu kofeinu nenašla souvislost s horším průběhem těhotenství a komplikacemi, jako je předčasný porod nebo omezený růst plodu.<\u002Fp>\n      <p>Má to ale háček. Závěry stojí na dotaznících, kde ženy samy uváděly, kolik kofeinu vypily, nikoliv na rozboru krve. A protože studie mapuje jen období kolem početí a zbytek těhotenství ani pozdější vývoj dítěte nesleduje, vzácnější komplikace, které se projeví později, spolehlivě zachytit nedokáže. Sami autoři proto uzavírají, že jsou potřeba přesnější měření kofeinu a dlouhodobé sledování dětí.<\u002Fp>\n\n      <div class=\"pullquote\">Tři pohledy, tři metody, tři závěry. Každý je jiný a&nbsp;právě proto ti nikdo nedá striktní závěry se stoprocentní jistotou.<\u002Fdiv>\n\n      <h2 class=\"h2\">Proč stejná káva působí na&nbsp;každou ženu jinak<\u002Fh2>\n      <p>Kus té neshody má na svědomí biologie. <strong>Rychlost, jakou tělo kofein odbourává, je z velké části daná geny.<\u002Fstrong> V té rychlosti se lidé liší až šedesátinásobně (<a class=\"internal\" href=\"https://link.springer.com/article/10.1186/s12967-024-05737-z\" target=\"_blank\" rel=\"noopener\">Journal of Translational Medicine, 2024<\u002Fa>). Stejný šálek tak u jedné ženy zmizí za pár hodin a u jiné se drží skoro celý den.<\u002Fp>\n      <p>Co to znamená pro těhotenství, ale zatím jasné není. Jedna japonská studie naznačila, že roli hraje kombinace genů a dávky, šlo ale o malou skupinu a výsledek se nepodařilo zopakovat. Jiná, větší studie (<a class=\"internal\" href=\"https://pubmed.ncbi.nlm.nih.gov/33764424/\" target=\"_blank\" rel=\"noopener\">NICHD, 2021<\u002Fa>) naopak žádný rozdíl podle genů nenašla. Takže i tady platí: zajímavá stopa, ne hotová pravda. Rozhodně to není návod „mám ty správné geny, tak si můžu dovolit víc“.<\u002Fp>\n\n      <h2 class=\"h2\">Jedna věc, na&nbsp;které se studie shodnou: v&nbsp;těhotenství se kofein drží déle<\u002Fh2>\n      <p>V čem panuje shoda, je farmakologie. Kofein prochází placentou a plod ho sám neodbourá. A tělo matky ho odbourává čím dál pomaleji: <strong>poločas rozpadu se prodlužuje z běžných 4 až 5 hodin zhruba na 15 hodin<\u002Fstrong> ke konci těhotenství, tedy asi třikrát déle (<a class=\"internal\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12526311/\" target=\"_blank\" rel=\"noopener\">přehledová studie, Nutrients 2025<\u002Fa>). Kofein se tak v těle drží a hromadí.<\u002Fp>\n      <p>Autoři téhle review z toho vyvodili návrh: možná by v těhotenství dávalo větší smysl řídit se ne denní dávkou, ale odstupem, třeba nanejvýš jedním nápojem s kofeinem za 24 až 36 hodin. Je to <strong>návrh jedné vědecké práce, ne oficiální doporučení.<\u002Fstrong> EFSA, ACOG ani Světová zdravotnická organizace (WHO) ho nepřevzaly.<\u002Fp>\n\n      <h2 class=\"h2\">Kolik kofeinu v&nbsp;těhotenství je oficiálně bezpečné<\u002Fh2>\n      <p>Zatímco se věda pře, oficiální limity se od roku 2015 nezměnily a úplně jednotné taky nejsou:<\u002Fp>\n      <ul>\n        <li><strong>EFSA<\u002Fstrong> a <strong>ACOG<\u002Fstrong>: do <strong>200 mg<\u002Fstrong> kofeinu denně ze všech zdrojů.<\u002Fli>\n        <li><strong>WHO<\u002Fstrong>: doporučuje snížit příjem u žen, které mají příjem kofeinu nad <strong>300 mg<\u002Fstrong> denně.<\u002Fli>\n      <\u002Ful>\n      <p>Pro představu, 200 mg jsou zhruba dva šálky filtrované kávy, ale kofein je i v čaji, kole a čokoládě a všechno se počítá dohromady. Kolik kofeinu mají jednotlivé alternativy, rozebíráme v článku <a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\" class=\"internal\">Co pít místo kávy<\u002Fa>.<\u002Fp>\n\n      <h2 class=\"h2\">Co si z&nbsp;toho vzít<\u002Fh2>\n      <p>Poctivá odpověď zní: <strong>jistota neexistuje a nejspíš chvíli nebude.<\u002Fstrong> Jedna část studií riziko nenachází, druhá před nimi přímo varuje, a nově do tématu vstupuje také biologie každého z nás. Rozhodnutí by tedy nemělo podléhat titulku ani jedné ze studií, ale tobě a tvému lékaři.<\u002Fp>\n      <p>Pokud jsi rozhodnutá pro změnu, máš dvě možnosti. Můžeš svůj příjem kofeinu hlídat a držet se pod doporučenou hranicí 200 mg, nebo kofein vynechat úplně a sáhnout po nápojích, které ho nemají. Novinkou mezi přirozeně bezkofeinovými nápoji je například <a href=\"https://tamoje.cz/datlova-pecka-espresso\" class=\"internal\">Datlová Pecka<\u002Fa>. Pražený nápoj s originální recepturou z datlových pecek a pečlivě vybrané směsi rostlin pro přípravu espressa i filtru. Obě cesty jsou legitimní. Důležité ale je mít jasno v tom, co dělá dobře právě tobě. Jen tak budeš mít radost z volby.<\u002Fp>\n\n      <!-- FAQ -->\n      <div class=\"faq\">\n        <h2 class=\"h2\" id=\"faq\">Často kladené otázky<\u002Fh2>\n        <div class=\"qa\"><p class=\"q\">Je prokázané, že káva v&nbsp;těhotenství škodí?<\u002Fp><p class=\"a\">Není. Většina dat jsou pozorovací studie, které ukazují souvislost, ne příčinu. Novější metody (mendelovská randomizace, objektivní biomarkery) naznačují, že část dřívějších obav mohla patřit spíš kouření a alkoholu než kávě. Neplyne z toho ale, že je káva prokázaně bezpečná. Věda tu jednotná není.<\u002Fp><\u002Fdiv>\n        <div class=\"qa\"><p class=\"q\">Proč jedna studie říká, že káva vadí, a&nbsp;druhá, že ne?<\u002Fp><p class=\"a\">Protože se liší metodou a protože kofein na každého působí jinak. Rychlost, jakou tělo kofein odbourává, je z velké části daná geny, mezi lidmi je až šedesátinásobný rozdíl. Jedna dávka tak může u dvou žen znamenat něco úplně jiného.<\u002Fp><\u002Fdiv>\n        <div class=\"qa\"><p class=\"q\">Změnily se doporučené limity kofeinu v&nbsp;těhotenství?<\u002Fp><p class=\"a\">Od roku 2015 ne. EFSA i americká ACOG drží hranici do 200 mg kofeinu denně ze všech zdrojů, WHO doporučuje snížit příjem u žen, u kterých je denní příjem kofeinu vyšší než 300 mg. O tom, co je pro tebe to pravé, se poraď se svým lékařem.<\u002Fp><\u002Fdiv>\n        <div class=\"qa\"><p class=\"q\">Proč se v&nbsp;těhotenství doporučuje méně kofeinu?<\u002Fp><p class=\"a\">Kofein prochází placentou a plod ho sám neodbourá. V těhotenství se navíc poločas rozpadu kofeinu prodlužuje z běžných 4 až 5 hodin zhruba na 15 hodin ke konci těhotenství, takže se v těle drží déle a hromadí se.<\u002Fp><\u002Fdiv>\n        <div class=\"qa\"><p class=\"q\">Můžu pít kávu v&nbsp;prvním trimestru?<\u002Fp><p class=\"a\">První trimestr je z hlediska vývoje nejcitlivější období a kofein se v těle drží déle už tady. Oficiální hranice do 200 mg kofeinu denně přitom platí pro celé těhotenství. Někomu navíc v prvních týdnech káva sama přestane chutnat, za to mohou hormonální změny. Kolik je pro tebe v pořádku, probeř se svým lékařem.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- HODNOCENÍ: interaktivní, ukládá vlastní hlas do prohlížeče -->\n      <div class=\"rating\" data-rating=\"\">\n        <p class=\"rating__label\">Ohodnoť článek<\u002Fp>\n        <div class=\"rating__stars\" role=\"radiogroup\" aria-label=\"Hodnocení článku\">\n          <button type=\"button\" class=\"rating__star\" data-val=\"1\" aria-label=\"1 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"2\" aria-label=\"2 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"3\" aria-label=\"3 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"4\" aria-label=\"4 z 5\">★<\u002Fbutton>\n          <button type=\"button\" class=\"rating__star\" data-val=\"5\" aria-label=\"5 z 5\">★<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"rating__count\" data-rating-msg=\"\">Zatím bez hodnocení. Buď první.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- O AUTORCE -->\n      <div class=\"authorbox\" id=\"autor\">\n        <span class=\"authorbox__avatar\">LM<\u002Fspan>\n        <p class=\"authorbox__role\">O autorce<\u002Fp>\n        <p class=\"authorbox__name\">Lucie Mokrá<\u002Fp>\n        <p class=\"authorbox__bio\">Zakladatelka značky tamoje. Datlovou Pecku vyvinula z touhy dopřát si espresso i filtr kdykoli během dne a přirozeně bez kofeinu. Píše o kávě, kofeinu a životě s ním i bez něj, s oporou v datech a nadšení objevovat nové chutě.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- RELATED -->\n      <div class=\"related\">\n        <h3>Mohlo by tě zajímat<\u002Fh3>\n        <ul>\n          <li><a href=\"https://tamoje.cz/blog/kofein-a-hormony\">→ Kofein a hormony: proč na tebe působí káva jinak<\u002Fa><\u002Fli>\n          <li><a href=\"https://tamoje.cz/blog/co-pit-misto-kavy\">→ Co pít místo kávy: 12 alternativ a jak vybrat<\u002Fa><\u002Fli>\n          <li><a href=\"https://tamoje.cz/blog/bezkofeinova-kava-metody-dekofeinizace-low-caf\">→ Bezkofeinová káva není bez kofeinu: celé spektrum a nové odrůdy<\u002Fa><\u002Fli>\n        <\u002Ful>\n        <div class=\"related__all\"><a class=\"related__btn\" href=\"/blog\">Čtení k jádru věci: všechny články <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ZDROJE -->\n      <div class=\"sources\">\n        <h3>Zdroje<\u002Fh3>\n        <p>Brito Nunes et al., <em>Int J Epidemiol<\u002Fem> 2022 (<a href=\"https://academic.oup.com/ije/article/52/1/165/6605011\" target=\"_blank\" rel=\"noopener\">→<\u002Fa>) · D'Urso et al. (MoBa), <em>Psychological Medicine<\u002
