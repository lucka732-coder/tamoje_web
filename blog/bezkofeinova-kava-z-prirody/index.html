    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // which transformScriptTags handles unconditionally.

      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ozeně bez kofeinu? Divoké kávovníky, šlechtěná arabica, genová editace a alternativy bez zrna. Co umí příroda a kam míří věda.\",\n  \"image\": \"https://tamoje.cz/user/articles/images/bezkofeinova-kava-z-prirody-tamoje.jpg\",\n  \"author\": {\"@type\": \"Person\", \"name\": \"Lucie Mokrá\", \"jobTitle\": \"zakladatelka\", \"worksFor\": {\"@type\": \"Organization\", \"name\": \"tamoje\"}},\n  \"publisher\": {\"@type\": \"Organization\", \"name\": \"tamoje\", \"logo\": {\"@type\": \"ImageObject\", \"url\": \"https://tamoje.cz/user/logos/tamoje-logo.png\"}},\n  \"datePublished\": \"2026-07-18\",\n  \"dateModified\": \"2026-07-18\",\n  \"mainEntityOfPage\": {\"@type\": \"WebPage\", \"@id\": \"https://tamoje.cz/blog/bezkofeinova-kava-z-prirody\"}\n}\n<\/script>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [\n    {\"@type\": \"Question\", \"name\": \"Existuje káva, která kofein nikdy neměla?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Ano. V přírodě rostou divoké kávovníky, které kofein netvoří, například Coffea humblotiana z Komorských ostrovů. Chybí jí gen na jeho výrobu. Zatím je ale jen ve výzkumu, ne v prodeji.\"}},\n    {\"@type\": \"Question\", \"name\": \"Čím se liší přirozeně bezkofeinová rostlina od decafu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"U decafu se kofein z hotové kávy odstraní. U přirozeně bezkofeinové rostliny tam kofein nikdy nebyl, takže není co odstraňovat.\"}},\n    {\"@type\": \"Question\", \"name\": \"Co je Decaffito?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Brazilský šlechtitelský program. Staví na vzácných rostlinách arabicy z Etiopie, které kvůli přirozené mutaci kofein skoro netvoří. Pořád je ve vývoji.\"}},\n    {\"@type\": \"Question\", \"name\": \"Umí věda kofein v kávě vypnout?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Ano, metodou CRISPR jde vypnout geny, které kofein vyrábějí. Pracuje na tom britský startup Tropic Biosciences, zatím ve fázi vývoje. Evropská pravidla pro takové úpravy se na přelomu let 2025 a 2026 uvolnila, naplno mají platit zhruba od poloviny roku 2028.\"}},\n    {\"@type\": \"Question\", \"name\": \"Proč většina nápojů bez zrna není bez kofeinu?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Protože kofein na konci většinou stejně přidávají, nejčastěji z čaje. Řeší hlavně chuť a udržitelnost, ne obsah kofeinu.\"}},\n    {\"@type\": \"Question\", \"name\": \"Existuje nápoj přirozeně bez kofeinu, který se připravuje jako káva?\", \"acceptedAnswer\": {\"@type\": \"Answer\", \"text\": \"Ano. Datlová Pecka od tamoje je pražený nápoj z datlových pecek a pečlivě vybrané směsi rostlin. Kofein nikdy neobsahovala. Připravíš ji stejně jako espresso, ve filtru i ve French pressu.\"}}\n  ]\n}\n<\/script>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BreadcrumbList\",\n  \"itemListElement\": [\n    {\"@type\": \"ListItem\", \"position\": 1, \"name\": \"tamoje\", \"item\": \"https://tamoje.cz\"},\n    {\"@type\": \"ListItem\", \"position\": 2, \"name\": \"Čtení k jádru věci\", \"item\": \"https://tamoje.cz/blog\"},\n    {\"@type\": \"ListItem\", \"position\": 3, \"name\": \"Bezkofeinová káva z přírody\"}\n  ]\n}\n<\/script>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b1a611c0-6d3c-4441-9fca-6cbecc363e9c\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e75f1f63-2fc7-4c0d-8088-79a4b92fdc91\") format('woff2');\n  unicode-range: U+03 einová káva není bez kofeinu</a>. Nyní se zaměříme na zajímavosti z přírody i laboratoří. Jaké jsou nejnovější genové mutace kávovníků i trendy v jejich šlechtění?</strong></p>\n\n      <div class=\"tldr\">\n        <h3 class=\"tldr__label\">Zde se dočteš, že:</h3>\n        <ul>\n          <li>V přírodě rostou kávovníky, které kofein netvoří vůbec. Jednomu dokonce chybí gen na jeho výrobu.</li>\n          <li>Proč nová bezkofeinová zrna stále nejsou k dostání.</li>\n          <li>Existuje arabica s přirozeně minimálním obsahem kofeinu a šlechtitelé s ní pracují už roky.</li>\n          <li>Jak umí věda zastavit tvorbu kofeinu přímo v kávovníku a co se právě změnilo v evropských pravidlech.</li>\n          <li>Proč většina nových trendy nápojů „bez zrn“ nakonec kofein stejně obsahuje.</li>\n        </ul>\n      </div>\n\n      <h2 class=\"h2\">Kávovníky bez kofeinu</h2>\n\n      <p>Málokdo tuší, že bezkofeinová káva nemusí vzniknout žádným odstraňováním kofeinu. V přírodě totiž rostou divoké kávovníky, které kofein netvoří vůbec.</p>\n\n      <p>Největší povědomí je o druhu <em>Coffea humblotiana</em> z Komorských ostrovů. Kofeinu má jen nepatrné množství, a to z prostého důvodu. Postrádá gen, který za výrobou kofeinu stojí, takzvanou kofeinsyntázu (odborně DXMT).</p>\n\n      <p>Kávovník totiž kofein nevytváří naráz, ale skládá ho postupně, krok po kroku. Úplně poslední krok, přeměnu meziproduktu zvaného theobromin na samotný kofein, má na starost jediný enzym, právě kofeinsyntáza. A přesně gen pro tenhle enzym v genomu humblotiany chybí, vypadl z něj celý úsek DNA. Rostlina tak dojede skoro až na konec, vytvoří theobromin, ale poslední krok už nemá čím dokončit, a kofein tím pádem nevznikne.</p>\n\n      <p>Přirozeně bez kofeinu je i další druh, <em>Coffea charrieriana</em> z Kamerunu. Vědci ho popsali v roce 2008 jako první bezkofeinovou kávu ze střední Afriky.</p>\n\n      <h2 class=\"h2\">Proč zatím nejsou k&nbsp;dostání</h2>\n\n      <p>Důvody jsou dva.</p>\n\n      <p>Ten první je botanický. Jde o jiné druhy kávovníků, než je běžně pěstovaná arabica. Arabica má čtyři sady chromozomů, tyhle divoké kávovníky jen dvě, a křížit rostliny s různým počtem chromozomů většinou nejde. Potomci bývají neplodní, takže přenést jejich bezkofeinovost do pěstované kávy je zatím nadmíru těžké.</p>\n\n      <p>Ten druhý je chuťový. Divoké druhy chutnají jinak než od dobré kávy očekáváme. I kdyby se pěstovaly snadno, do šálku, který by sis rád dopřál, mají zatím daleko.</p>\n\n      <h2 class=\"h2\">Šlechtění nových odrůd</h2>\n\n      <p>Nadějnější cesta k přirozeně bezkofeinové kávě vede přes samotnou arabicu. V Etiopii se mezi tisícovkami kávovníků našly tři vzácné rostliny, které kvůli přirozené mutaci tvoří kofeinu jen zlomek. Přesněji zhruba dvacetkrát méně než běžná arabica. A protože jde pořád o arabicu, dají se křížit s odrůdami, které se běžně pěstují.</p>\n\n      <p>Brazilský program pro šlechtění nových odrůd kávovníků už roky tuto specifickou odrůdu vyvíjí a s důvtipem ji pojmenoval Decaffito. Háček je v nízké úrodě a také v tom, že se znak nízkého obsahu kofeinu špatně přenáší do potomstva. Cesta je otevřená, ale problematická a pomalá.</p>\n\n      <h2 class=\"h2\">Genová editace kávovníku</h2>\n\n      <p>Nejnovější přístup se metodou křížení vůbec nezaobírá. Využívá novou metodu CRISPR, tedy nástroj na cílené úpravy genů, kterým je možné přímo v kávovníku vyřadit geny zodpovědné za tvorbu kofeinu. Rostlina ho pak přirozeně netvoří a přitom zůstává stejnou odrůdou. Pracuje na tom britský startup Tropic Biosciences, zatím ve fázi vývoje.</p>\n\n      <p>A zde je čerstvá novinka. Dlouho byla hlavním limitem vývoje přísná evropská pravidla pro genové úpravy rostlin. Ta se ale právě mění. Na konci roku 2025 se EU dohodla, že jednodušší úpravy, jako je právě vypnutí jediného genu, bude posuzovat mírněji než klasické GMO, a na jaře 2026 tento návrh Rada EU formálně schválila. Naplno mají nová pravidla platit zhruba od poloviny roku 2028. Jestli se to dotkne přímo kávy, zatím nikdo neslibuje. Ale směr je jasný.</p>\n\n      <div class=\"callout\">\n        <div class=\"lbl\">Zajímavost</div>\n        <p>Kofein není pro rostlinu luxus, ale obrana. Slouží jí jako přírodní pesticid. Když ho tedy vyšlechtíme nebo vypneme, ubereme kávovníku i kus jeho ochrany před škůdci. Právě proto bývají nízkokofeinové odrůdy křehčí a hůř se pěstují.</p>\n      </div>\n\n      <h2 class=\"h2\">Nové trendy ve&nbsp;světě „kávy“</h2>\n\n      <p>Vedle šlechtění a genetiky zaznamenáváme ještě jeden výrazný trend, který se zaměřuje na hledání přirozeně bezkofeinových možností v jiných surovinách a bez kávových zrn. Ve světě tak můžeme narazit například na „kávu“ z různých upcyklovaných surovin, luštěnin a různých rostlinných směsí.</p>\n\n      <p>Přestože má tento trend blízko k tématu tohoto článku, většina produktů na trhu kofein nakonec obsahuje. Přidává se cíleně jako součást receptury a nejčastěji je použit kofein z čaje. Nejde tedy o nápoj bez kofeinu, spíše o reakci na měnící se podmínky pěstitelnosti kávy, kterým se věnuji v <a href=\"/blog/klimaticka-zmena-a-datlova-kava\" class=\"internal\">článku o tom, kam se posouvá káva</a>.</p>\n\n      <p>Do vlny objevování nových zdrojů tvého oblíbeného espressa a filtr přitom patří i naše Datlová Pecka. U ní ale kofein nehledej. Je přirozená a vychutnáš si ji kdykoliv chceš.</p>\n\n      <p><a href=\"https://tamoje.cz/datlova-pecka-espresso\" class=\"internal\">Datlová Pecka</a> je prémiový blend datlových pecek a šesti pečlivě vybraných rostlin. Má karamelově lehkou svěží chuť s ovocnými tóny datlí a připravíš ji přesně tak, jak máš nejraději, jako espresso i filtr.</p>\n\n      <p>Datlová pecka je tvá další příležitost setkávat se s přáteli, rodinou i se sebou.</p>\n\n      <h2 class=\"h2\">Přehled: kudy všudy vede cesta ke&nbsp;kávě bez&nbsp;kofeinu</h2>\n\n      <table class=\"ctable\">\n        <thead>\n          <tr><th>Cesta</th><th>Jak funguje</th><th>Kde to dnes je</th></tr>\n        </thead>\n        <tbody>\n          <tr><td><strong>Dekofeinizace (decaf)</strong></td><td>kofein se z hotové kávy odstraní (voda, CO₂ nebo rozpouštědlo)</td><td>běžně v prodeji</td></tr>\n          <tr><td><strong>Divoké bezkofeinové druhy</strong></td><td>rostlina kofein nikdy netvořila, chybí jí gen</td><td>zatím jen ve výzkumu</td></tr>\n          <tr><td><strong>Šlechtěná arabica</strong> (Decaffito)</td><td>přirozená mutace, kofein skoro netvoří</td><td>pokusná pole, roky vývoje</td></tr>\n          <tr><td><strong>Genová editace</strong> (CRISPR)</td><td>vypnou se geny na tvorbu kofeinu</td><td>ve vývoji, čeká na pravidla</td></tr>\n          <tr><td><strong>Nápoje bez zrn</strong></td><td>různé suroviny s přidaným kofeinem většinou z čaje</td><td>na zahraničním trhu</td></tr>\n          <tr class=\"hl\"><td><strong>Datlová Pecka</strong></td><td>blend pražených datlových pecek a směsi rostlin</td><td>dostupné už nyní na <a href=\"https://tamoje.cz/datlova-pecka-espresso\" class=\"internal\">tamoje.cz</a></td></tr>\n        </tbody>\n      </table>\n      <p class=\"snote\">Zdroje: Raharimalala a kol., Scientific Reports 2021 (Coffea humblotiana, chybějící gen kofeinsyntázy); Silvarolla a kol., Nature 2004 (přirozeně bezkofeinová arabica / Decaffito); Rada EU, prosinec 2025 a duben 2026 (nová pravidla pro genové úpravy rostlin, NGT); Tropic Biosciences. Datlová Pecka: přirozeně bez kofeinu (datlová pecka kofein neobsahuje).</p>\n\n      <h2 class=\"h2\">Co si z&nbsp;toho vzít</h2>\n\n      <p>Bezkofeinová káva už dnes neznamená jen kávu, ze které se kofein odstranil. Příroda i věda otevírají další cesty: divoké druhy bez genu na kofein, šlechtěnou arabicu s minimem kofeinu i genovou editaci. Většina z nich je ale zatím ve výzkumu a chvíli potrvá, než se dostane do tvého šálku. A pak je tu úplně jiná cesta, dostupná už teď: sáhnout po surovině, která kofein nikdy neměla.</p>\n\n      <!-- FAQ -->\n      <div class=\"faq\">\n        <h2 class=\"h2\" id=\"faq\">Často kladené otázky</h2>\n        <div class=\"qa\"><p class=\"q\">Existuje káva, která kofein nikdy neměla?</p><p class=\"a\">Ano. V přírodě rostou divoké kávovníky, které kofein netvoří, například <em>Coffea humblotiana</em> z Komorských ostrovů. Chybí jí gen na jeho výrobu. Zatím je ale jen ve výzkumu, ne v prodeji.</p></div>\n        <div class=\"qa\"><p class=\"q\">Čím se liší přirozeně bezkofeinová rostlina od&nbsp;decafu?</p><p class=\"a\">U decafu se kofein z hotové kávy odstraní. U přirozeně bezkofeinové rostliny tam kofein nikdy nebyl, takže není co odstraňovat.</p></div>\n        <div class=\"qa\"><p class=\"q\">Co je Decaffito?</p><p class=\"a\">Brazilský šlechtitelský program. Staví na vzácných rostlinách arabicy z Etiopie, které kvůli přirozené mutaci kofein skoro netvoří. Pořád je ve vývoji.</p></div>\n        <div class=\"qa\"><p class=\"q\">Umí věda kofein v&nbsp;kávě „vypnout“?</p><p class=\"a\">Ano, metodou CRISPR jde vypnout geny, které kofein vyrábějí. Pracuje na tom britský startup Tropic Biosciences, zatím ve fázi vývoje. Evropská pravidla pro takové úpravy se navíc na přelomu let 2025 a 2026 uvolnila, naplno mají platit zhruba od poloviny roku 2028.</p></div>\n        <div class=\"qa\"><p class=\"q\">Proč většina nápojů „bez zrna“ není bez&nbsp;kofeinu?</p><p class=\"a\">Protože kofein na konci většinou stejně přidávají, nejčastěji z čaje. Řeší hlavně chuť a udržitelnost, ne obsah kofeinu.</p></div>\n        <div class=\"qa\"><p class=\"q\">Existuje nápoj přirozeně bez&nbsp;kofeinu, který se připravuje jako káva?</p><p class=\"a\">Ano. Datlová Pecka od tamoje je pražený nápoj z datlových pecek a pečlivě vybrané směsi rostlin. Kofein nikdy neobsahovala. Připravíš ji stejně jako espresso, ve filtru i ve French pressu.</p></div>\n      </div>\n\n      <!-- HODNOCENÍ: interaktivní, ukládá vlastní hlas do prohlížeče -->\n      <div class=\"rating\" data-rating=\"\">\n        <p class=\"rating__label\">Ohodnoť článe
